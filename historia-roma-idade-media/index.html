<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF3FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="História: Roma e Idade Média 6º ano">
<title>História: Roma e Idade Média 6º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: uma coluna de celular (max 560px). Mapa em trilha; rodada = barra de progresso no topo, cartão no meio, botão grande embaixo.
   Cada módulo define sua cor em --mc / --mc-d / --mc-l. Tema claro fixo de propósito (jogo infantil). */
:root{
  --bg:#EEF3FB; --card:#FFFFFF; --ink:#1D2340; --muted:#5D6487; --line:#D6DDEC;
  --blue:#2D5BD0; --blue-d:#1F44A6; --blue-l:#E3EBFD;
  --green:#14755B; --green-d:#0C5643; --green-l:#DDF2EA;
  --amber:#E7A21B; --amber-d:#A96F00; --amber-l:#FFF2D3;
  --purple:#7A4FD0; --purple-d:#5A33A8; --purple-l:#EEE7FC;
  --pink:#C4407A; --pink-d:#9A2C5D; --pink-l:#FBE4EE;
  --cyan:#0F8BA8; --cyan-d:#0A6880; --cyan-l:#DDF3F8;
  --ok:#2FA968; --ok-d:#1F8450; --ok-l:#DDF6E7;
  --oops:#E8723C; --oops-d:#BD5323; --oops-l:#FFE8DC;
  --gold:#F5B800; --rust:#C4572A;
  --mc:var(--blue); --mc-d:var(--blue-d); --mc-l:var(--blue-l);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:140px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .08s, box-shadow .08s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn[disabled]{background:var(--line);color:#8E96B3;box-shadow:0 5px 0 #C3CBDD;cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.oops{background:var(--oops);box-shadow:0 5px 0 var(--oops-d)}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost[disabled]{color:#9AA2BE;background:var(--card)}
.btn.small{font-size:16px;padding:10px 14px}

/* ---------- mascote e avatares ---------- */
.tico{display:block;flex:none}
.bounce{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.ava{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--f-display);font-weight:800;flex:none;line-height:1}
.ava.ghost{background:var(--card);border:3px dashed var(--line);color:var(--muted)}

/* ---------- início / perfis ---------- */
.start{display:grid;gap:18px;padding-top:24px;text-align:center;justify-items:center}
.start h1{font-size:40px;color:var(--blue-d)}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-weight:700;max-width:420px}
.bubble::after{content:"";position:absolute;left:50%;top:-11px;width:18px;height:18px;background:var(--card);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.small{font-size:15px}
.bubble.small::after{display:none}
.name-in,.write-in{width:100%;max-width:340px;font:800 24px var(--f-display);text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.name-in::placeholder,.write-in::placeholder{color:#9AA2BE}
.perfis{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.perfil{display:grid;justify-items:center;gap:6px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);min-width:108px}
.perfil b{font-size:17px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- mapa ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 12px}
.chip-perfil{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.hello{font:800 24px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:900;font-variant-numeric:tabular-nums}
.pill svg{width:19px;height:19px}
.hero{margin-bottom:14px;padding:14px 16px}
.hero-t{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero-m{font:800 26px var(--f-display);color:var(--blue-d);line-height:1.1}
.hero-m span{font-size:18px;color:var(--muted)}
.prova{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:900;color:var(--oops-d);background:var(--oops-l);border-radius:999px;padding:3px 12px 3px 8px;font-size:15px}
.prova svg{width:18px;height:18px}
.meta{flex:1;min-width:180px}
.meta-l{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--muted);margin-bottom:4px}
.aviso{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:14px;font-size:15px;text-align:left}
.aviso.novo{border-color:var(--gold);background:#FFF8E0}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.acoes .btn{font-size:15px;padding:12px 8px}
.acoes #treino{grid-column:1/-1;font-size:19px;background:var(--purple);box-shadow:0 5px 0 var(--purple-d)}
.acoes>:nth-child(4){grid-column:1/-1}
.mod{margin-bottom:26px}
.mod-head{border-radius:20px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;background:var(--mc)}
.mod-head .num{font:800 34px var(--f-display);opacity:.9;line-height:1}
.mod-head h2{font-size:26px}
.mod-head p{margin:0;font-weight:700;opacity:.92;font-size:15px}
.trail{display:grid;gap:14px;padding:18px 0 0}
.node{display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%}
.node:nth-child(4n+2){margin-left:16%}
.node:nth-child(4n+3){margin-left:30%}
.node:nth-child(4n+4){margin-left:16%}
.dot{flex:none;width:76px;height:76px;border-radius:50%;padding:5px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.dot-in{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:800 28px var(--f-display);color:#fff;border:3px solid #fff}
.node-label{min-width:0}
.node-label b{display:block;font-size:16px;line-height:1.2}
.node-label .sub{display:block;color:var(--muted);font-weight:800;font-size:13px;margin-top:2px}
.aqui{color:var(--oops-d);font-weight:900}
.stars{display:flex;gap:2px;margin-top:3px}
.stars svg{width:18px;height:18px}
.final .dot{width:88px;height:88px;background:var(--gold)}
.settings{margin-top:30px;background:var(--card);border-radius:18px;border:2px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.settings h3{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.row.wrap{flex-wrap:wrap;justify-content:flex-start;gap:6px 18px}
.toggle{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{left:28px}
.linkbtn{color:var(--blue);font-weight:800;text-decoration:underline;padding:4px 0}
.linkbtn.danger{color:var(--oops-d)}

/* ---------- portal ---------- */
.materias{display:grid;gap:14px}
.materia{display:grid;gap:8px;background:var(--card);border:2px solid var(--line);border-left:10px solid var(--mc);border-radius:18px;padding:14px 16px;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--line)}
.mt-top{display:flex;align-items:baseline;gap:8px}
.mt-top h2{font-size:26px}
.mt-top span{font-weight:800;color:var(--muted)}
.mt-mods{display:flex;flex-wrap:wrap;gap:6px}
.mt-mods span{font-size:13px;font-weight:800;background:var(--bg);border-radius:999px;padding:2px 10px;color:var(--muted)}
.materia small{color:var(--muted);font-weight:700}

/* ---------- rodada ---------- */
.lesson{display:flex;flex-direction:column;gap:16px}
.lbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:5}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--muted)}
.x svg{width:24px;height:24px}
.prog{flex:1;height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.prog.small{height:12px}
.prog i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .4s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-weight:900;color:var(--oops-d);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.cmb{display:inline-flex;align-items:center;gap:2px}
.cmb svg{width:18px;height:18px}
.card{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:18px}
.kicker{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.ex-title{font-size:28px;margin-bottom:12px}
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font:800 22px var(--f-display);background:var(--bg);border-radius:16px;padding:12px;margin:6px 0 14px}
.formula .fx{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;white-space:nowrap}
.formula .s{color:var(--mc);border-color:var(--mc)}
.formula .op{color:var(--muted)}
.ex-body p{margin:0 0 10px}
.ex-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.ex-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:800;font-size:19px}
.ex-list li.ex-sep{background:none;padding:6px 0 0;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ex-list .arrow{color:var(--muted)}
.ex-list small{flex-basis:100%;font-weight:600;font-size:14px;color:var(--muted)}
mark{background:none;color:var(--mc-d);font-weight:900;text-decoration:underline 3px;text-underline-offset:3px}
.tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tip .bubble{flex:1;text-align:left;font-size:16px}
.tip .bubble::after{left:-11px;top:24px;transform:rotate(-45deg)}
.tip .bubble b{color:var(--rust)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twocol>div{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.twocol h4{margin:0 0 4px;font:800 15px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.twocol .big{font:800 21px var(--f-display);line-height:1.2}
.twocol small{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.mtx{border-collapse:separate;border-spacing:4px;margin:4px auto;font-variant-numeric:tabular-nums}
.mtx th{font-size:13px;color:var(--muted);font-weight:800;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.mtx td{background:var(--mc-l);border-radius:10px;font:800 26px var(--f-display);color:var(--mc-d);text-align:center;min-width:76px;padding:4px 8px}
.mtx td.q{background:var(--amber-l);color:var(--amber-d);outline:3px dashed var(--amber)}
.mtx caption{font:800 16px var(--f-display);color:var(--mc-d);padding-bottom:2px}
.mtx-wrap{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;overflow-x:auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.qlabel{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.spk{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
.spk svg{width:24px;height:24px}
.prompt{font-size:25px;font-weight:700;margin-bottom:16px}
.prompt b{color:var(--mc-d)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-l);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--oops);background:var(--oops-l);box-shadow:0 4px 0 var(--oops)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center}
.toks{display:flex;flex-wrap:wrap;gap:8px;font-size:22px;line-height:1.2}
.tok{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--line)}
.tok.sel{border-color:var(--mc);background:var(--mc-l);box-shadow:0 3px 0 var(--mc)}
.tok.right{border-color:var(--ok);background:var(--ok-l)}
.tok.miss{border-color:var(--oops);border-style:dashed}
.tok.wrong{border-color:var(--oops);background:var(--oops-l)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;min-width:0}
.mt{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--line);text-align:center}
.mt.sel{border-color:var(--amber);background:var(--amber-l);box-shadow:0 4px 0 var(--amber)}
.mt.neutro{border-color:var(--line);background:var(--bg);color:var(--muted);box-shadow:none}
.mt.done{border-color:var(--ok);background:var(--ok-l);color:var(--ok-d);box-shadow:none;opacity:.75}
.write-in{max-width:none;text-align:left;font-size:24px}
.write-in.right{border-color:var(--ok);background:var(--ok-l)}
.write-in.wrong{border-color:var(--oops);background:var(--oops-l)}
.dica{margin:8px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom .inner{max-width:560px;margin:0 auto;display:grid;gap:12px}
.bottom.good{background:var(--ok-l);border-color:var(--ok)}
.bottom.bad{background:var(--oops-l);border-color:var(--oops)}
.hint-b{text-align:center;font-weight:800;color:var(--muted)}
.fb{display:flex;gap:12px;align-items:center}
.fb h3{font-size:26px}
.good .fb h3{color:var(--ok-d)}
.bad .fb h3{color:var(--oops-d)}
.fb p{margin:2px 0 0;font-weight:700}
.fb .why{font-weight:600;font-size:15px;color:var(--ink)}
.slide{animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.xpfly{font:800 20px var(--f-display);color:var(--amber-d)}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- cartões ---------- */
.flash{width:100%;display:grid;gap:14px;align-content:center;justify-items:center;text-align:center;min-height:300px;background:var(--card);border:3px solid var(--mc);border-radius:24px;padding:22px 18px;box-shadow:0 6px 0 var(--mc-d)}
.f-frente{font:800 28px var(--f-display);color:var(--mc-d);line-height:1.2}
.f-verso{font-weight:800;font-size:20px;background:var(--mc-l);border-radius:16px;padding:12px 14px;line-height:1.4}
.f-hint{color:var(--muted);font-weight:800}
.flash.virado{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}

/* ---------- fim ---------- */
.end{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:20px}
.end h1{font-size:36px;color:var(--ok-d)}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:58px;height:58px}
.bigstars svg.on{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{border-radius:16px;border:2px solid var(--line);background:var(--card);padding:10px 6px;text-align:center}
.stat b{display:block;font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.end .btn{max-width:420px}
.end .aviso{max-width:420px;width:100%}
.meta-ok svg{flex:none}
.erros{width:100%;text-align:left}
.erros h3{font-size:22px;margin-bottom:6px}
.err{border-top:2px solid var(--line);padding:10px 0}
.err p{margin:4px 0}
.err .eq{font-weight:800}
.err .why{color:var(--muted);font-size:15px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:1px 8px;margin-right:4px}
.tag.bad{background:var(--oops-l);color:var(--oops-d)}
.tag.good{background:var(--ok-l);color:var(--ok-d)}

/* ---------- resumão e pais ---------- */
.res{display:grid;gap:14px}
.res .card h3{font-size:22px;margin-bottom:8px}
.res ul{margin:0;padding-left:20px;display:grid;gap:6px}
.res li b{font-weight:900}
.pais{display:grid;gap:12px}
.pais-h{display:flex;gap:12px;align-items:center}
.pais-h small{color:var(--muted);font-weight:700}
.pais p{margin:0}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tb th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tb td:not(:first-child),.tb th:not(:first-child){text-align:center;font-variant-numeric:tabular-nums}
.piores{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.piores small{color:var(--muted)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.bounce,.pop,.slide,.shake,.bigstars svg.on,.flash.virado{animation:none}}
@media (max-width:380px){.prompt{font-size:22px}.ex-title{font-size:24px}.node:nth-child(4n+3){margin-left:22%}.hello{font-size:20px}.pill{padding:3px 7px}}

</style>
</head>
<body data-portal="1">
<div id="app"></div>

<script>

/* ---------- tela "quem vai estudar?" (usada no portal e nas matérias) ---------- */
function telaPerfis($app, aoEscolher, texto) {
  hush();
  const lista = DB.perfis;
  $app.innerHTML = `<div class="start">
    ${tico('happy', 130, 'bounce')}
    <div class="bubble">${lista.length ? (texto || 'Oi! Eu sou o <b>Tico</b>. Quem vai estudar comigo hoje?') : 'Oi! Eu sou o <b>Tico</b>, um tico-tico. Vou te ajudar a estudar. Qual é o seu nome?'}</div>
    ${lista.length ? `<div class="perfis">${lista.map(p => `<button class="perfil" data-p="${p.id}">${avatar(p, 64)}<b>${esc(p.nome)}</b></button>`).join('')}
      <button class="perfil novo" id="add"><span class="ava ghost" style="width:64px;height:64px">${ICON.plus}</span><b>Adicionar</b></button></div>` : ''}
    <div id="novoBox" ${lista.length ? 'hidden' : ''} style="width:100%;display:grid;gap:12px;justify-items:center">
      <input class="name-in" id="nm" maxlength="20" placeholder="Digite seu nome" aria-label="Seu nome" autocomplete="off">
      <button class="btn" id="go" style="max-width:340px">Começar</button>
    </div>
  </div>`;
  const entrar = p => { DB.ativo = p.id; gravar(); audio(); SFX.tap(); aoEscolher(p); };
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => entrar(DB.perfis.find(p => p.id === b.dataset.p)));
  const add = document.getElementById('add');
  if (add) add.onclick = () => { SFX.tap(); document.getElementById('novoBox').hidden = false; add.hidden = true; document.getElementById('nm').focus(); };
  const go = () => { const n = (document.getElementById('nm').value || '').trim(); if (!n) { document.getElementById('nm').focus(); return; } entrar(novoPerfil(n)); };
  document.getElementById('go').onclick = go;
  document.getElementById('nm').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
}

<script>
/* ===================== AJUDANTES DE CONTEÚDO =====================
   Atalhos para escrever uma matéria em materias/<slug>/conteudo.js.
   Regra de ouro: em mc(...) a resposta certa é SEMPRE a primeira opção (o jogo embaralha na tela).
   Cada pergunta ganha um id fixo (calculado do texto), usado para saber o que a criança já viu. */

let LOTE_ATUAL = 1;
function hashId(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function chavePergunta(q) { return [q.t, q.q, JSON.stringify(q.o || q.s || q.pairs || q.r || ''), JSON.stringify(q.cell || '')].join('|'); }

// tipos de pergunta
const mc = (q, o, why, x = {}) => ({ t: 'mc', q, o, a: 0, why, lote: LOTE_ATUAL, ...x });
const vf = (q, v, why) => ({ t: 'mc', q: 'Verdadeiro ou falso? ' + q, o: ['Verdadeiro', 'Falso'], a: v ? 0 : 1, keep: true, two: true, why, lote: LOTE_ATUAL });
const fixas = opcoes => (q, a, why) => ({ t: 'mc', q, o: opcoes, a, keep: true, why, lote: LOTE_ATUAL }); // mesmas opções sempre, na mesma ordem
const tap = (frase, a, why, x = {}) => ({ t: 'tap', q: x.q || 'Toque nas palavras certas.', s: frase.split(' '), a, why, conjunto: x.conjunto, lote: LOTE_ATUAL });
const pares = (q, lista, why) => ({ t: 'match', q, pairs: lista, why, lote: LOTE_ATUAL });
const tabela = (nome, cell, o, why, x = {}) => ({ t: 'table', tab: nome, cell, q: x.q || 'O que está faltando na tabela?', o, a: 0, why, lote: LOTE_ATUAL });
const escrever = (q, r, why, x = {}) => ({ t: 'write', q, r: [].concat(r), why, dica: x.dica || '', lote: LOTE_ATUAL });

// estrutura
const ex = o => ({ t: 'explain', ...o });
function lote(n, perguntas) { return perguntas.map(p => Object.assign(p, { lote: n })); }
const bloco = (explica, perguntas) => ({ explica, perguntas });
const licao = (id, titulo, blocos, x = {}) => ({ id, titulo, blocos, ...x });
const modulo = (id, nome, desc, cor, licoes) => ({ id, nome, desc, cor, licoes });

function materia(m) {
  m.rodada = m.rodada || 8;
  m.simulado = Object.assign({ titulo: 'Simulado da prova', quantas: 16, extras: [] }, m.simulado || {});
  const darId = (lid, q) => { q.id = lid + '_' + hashId(lid + '|' + chavePergunta(q)); };
  m.modulos.forEach(md => md.licoes.forEach(l => l.blocos.forEach(b => b.perguntas.forEach(q => darId(l.id, q)))));
  m.simulado.extras.forEach(q => darId('simulado', q));
  return m;
}

          mc('Em qual fronteira do Império os persas faziam pressão?', ['Na fronteira oriental (leste)', 'Na fronteira do norte, no rio Reno', 'Na costa do Oceano Atlântico', 'Dentro da cidade de Roma'], 'Os persas pressionavam as fronteiras orientais, ou seja, do leste.'),
          mc('Qual destes fatores também ajudou a provocar mudanças no Império?', ['O território enorme, difícil de administrar', 'A invenção da pólvora', 'O excesso de escravizados baratos', 'A paz com todos os vizinhos'], 'A vastidão do território e os desafios para administrá-lo contribuíram para as mudanças.'),
          escrever('Complete: esse período de incerteza ficou conhecido como Crise do ____.', 'Império', 'O nome é Crise do Império.'),
          vf('A cultura dos germânicos era diferente da cultura latina dos romanos.', true, 'É verdadeiro. A apostila diz que os germânicos tinham uma cultura distinta da latina.'),
          pares('Ligue cada nome à informação certa.', [['Germânicos', 'Clãs e chefes guerreiros'], ['Persas', 'Fronteiras do Oriente'], ['Bárbaros', 'Povos não latinos, para os romanos']], 'Germânicos viviam em clãs; persas apertavam o leste; bárbaro era o nome dado aos não latinos.'),
          mc('Até que século a Crise do Império se estendeu?', ['Século IV d.C.', 'Século I a.C.', 'Século X d.C.', 'Século XV d.C.'], 'A crise começou no século III e foi até o século IV d.C.'),
        ]),
      ]),
    ], { cartoes: [['Crise do Império', 'Cerca de <b>200 anos</b> (séculos III e IV).<br>Causas principais: <b>disputa com outros povos</b> e <b>falta de escravizados</b>.'], ['Germânicos x persas', 'Germânicos: <b>norte</b>, clãs, rio Reno.<br>Persas: fronteira do <b>Oriente</b>.']] }),

    licao('cr2', 'Imperadores, exército e guerra', [
      bloco(ex({ title: 'Imperadores trocando o tempo todo',
        body: '<p>Na crise houve <b>instabilidade política</b>: os imperadores <b>trocavam o tempo todo</b>. Os <b>soldados do exército</b> nomeavam ou derrubavam imperadores, que muitas vezes nem eram reconhecidos pelo <b>Senado</b>. O Senado <b>perdeu seu poder para o Exército</b>. A maioria dos imperadores desse tempo <b>morreu em guerras ou conspirações</b> (planos secretos contra alguém, muitas vezes para derrubar ou matar).</p>'
          + '<p>As guerras com germânicos e persas viraram um problema de economia: nas regiões em conflito, a <b>agricultura</b> e o <b>artesanato</b> pararam. Isso prejudicou o <b>abastecimento de Roma</b> e a <b>cobrança de impostos</b>.</p>'
          + '<p>Resultado: <b>falta de comida nas cidades</b>, <b>queda na produção agrícola</b>, <b>inflação</b> (preços subindo) e <b>fome</b>. Quem mais sofreu foi a parte mais pobre da <b>plebe</b>.</p>',
        list: [['Exército', 'escolhe e derruba imperadores'], ['Senado', '<mark>perde poder</mark>'], ['Guerra', 'a produção parou → <mark>fome e inflação</mark>']],
        memo: 'Quem mandava era a <b>espada</b>: o exército escolhia o imperador, e o Senado ficou sem poder.',
        say: 'Na crise, os imperadores trocavam toda hora. Os soldados escolhiam e derrubavam imperadores, e o Senado perdeu poder para o exército. As guerras pararam a agricultura e o artesanato. Faltou comida, os preços subiram e houve fome, principalmente para a plebe mais pobre.' }), [
        ...lote(1, [
          mc('Quem nomeava ou derrubava os imperadores durante a crise?', ['Os soldados do exército', 'Os escravizados', 'O papa', 'O povo, em eleições'], 'Os soldados do exército nomeavam ou destituíam os líderes.'),
          mc('O que aconteceu com o poder do Senado durante a crise?', ['Perdeu poder para o Exército', 'Ficou mais forte do que nunca', 'Passou a escolher o papa', 'Foi entregue aos persas'], 'O Senado havia perdido seu poder para o Exército.'),
          mc('Como morreu a maioria dos imperadores desse período?', ['Em guerras ou conspirações', 'De velhice, em paz', 'Em naufrágios', 'Em terremotos'], 'A maioria dos imperadores morreu em guerras ou conspirações.'),
          vf('Durante a crise, os imperadores trocavam muitas vezes, o que gerou instabilidade política.', true, 'É verdadeiro. Muitas mudanças de imperadores = instabilidade política.'),
          mc('O que quer dizer "instabilidade política"?', ['Governo que muda toda hora e não se firma', 'Governo que dura muitos anos', 'Paz entre os povos', 'Um tipo de imposto'], 'Instável é o que não fica firme. Na política, é o governo que troca o tempo todo.'),
          mc('O que as guerras com germânicos e persas interromperam nas regiões atingidas?', ['As atividades agrícolas e artesanais', 'As aulas nas escolas da Igreja', 'A construção de castelos feudais', 'As viagens para a América'], 'Nas regiões em conflito, a agricultura e o artesanato pararam.'),
          mc('Por que as guerras diminuíram a cobrança de impostos?', ['As regiões em guerra pararam de produzir', 'O imperador perdoou todas as dívidas', 'Os impostos foram proibidos', 'Todos viraram soldados'], 'Sem produção, não havia o que taxar. A arrecadação de impostos caiu.'),
          mc('O que é <b>inflação</b>?', ['Os preços subindo de forma geral', 'Os preços caindo', 'A falta de soldados', 'Um tipo de moeda romana'], 'Inflação é quando os preços sobem de forma geral e o dinheiro compra menos.'),
          mc('Quem foi mais afetado pela fome e pela inflação?', ['A parte mais pobre da plebe', 'Os imperadores', 'Os senadores ricos', 'Os generais'], 'A apostila diz que a crise afetou especialmente a população mais vulnerável da plebe.'),
          mc('Qual destes fatos <b>NÃO</b> foi consequência das guerras na economia romana?', ['Aumento da produção agrícola', 'Falta de comida nas cidades', 'Inflação generalizada', 'Crises de fome'], 'A produção agrícola diminuiu, não aumentou.'),
          pares('Ligue a causa à consequência.', [['Soldados escolhem imperadores', 'Senado perde poder'], ['Guerras nas regiões', 'Agricultura e artesanato param'], ['Menos alimentos produzidos', 'Fome e preços altos']], 'Na crise, um problema puxava o outro.'),
          vf('O Senado sempre reconhecia os imperadores escolhidos pelos soldados.', false, 'Falso. Muitas vezes o Senado não reconhecia esses imperadores.'),
          mc('Por que o abastecimento de Roma foi prejudicado?', ['As regiões em guerra pararam de produzir e de enviar alimentos', 'Roma passou a produzir comida demais', 'Os persas compraram toda a comida', 'Os cristãos proibiram o comércio'], 'Com as regiões em conflito, os alimentos não chegavam a Roma.'),
          escrever('Complete: durante a crise, o Senado perdeu seu poder para o ____.', 'Exército', 'O Senado perdeu seu poder para o Exército.'),
          mc('O que é uma <b>conspiração</b>?', ['Um plano secreto contra alguém', 'Uma festa do imperador', 'Um tipo de moeda', 'Uma lei do Senado'], 'Conspiração é um plano secreto, muitas vezes para derrubar ou matar um governante.'),
        ]),
      ]),
    ], { cartoes: [['Instabilidade política', 'Imperadores trocando toda hora.<br>O <b>exército</b> escolhia; o <b>Senado</b> perdeu poder.'], ['Guerra e economia', 'Regiões em guerra param de produzir → falta comida, <b>inflação</b> e <b>fome</b>.']] }),

    licao('cr3', 'Por que Roma empobreceu', [
      bloco(ex({ title: 'Gastos altos e falta de escravizados',
        body: '<p>Os principais motivos da crise econômica foram o <b>empobrecimento do Império</b> e o <b>problema da mão de obra</b>.</p>'
          + '<p><b>1. Grandes obras e exército:</b> o Estado gastava muito. Administrar o território enorme, <b>pagar o exército</b> e <b>defender as fronteiras</b> ficava mais caro à medida que o Império crescia. Manter <b>prédios públicos</b> e pagar espetáculos da política do <b>"pão e circo"</b> (comida e diversão de graça para o povo) também esvaziava os cofres.</p>'
          + '<p><b>2. Crise do mercado de escravizados:</b> com o <b>fim das guerras de conquista</b>, faltaram prisioneiros e, portanto, <b>escravizados</b>. Como os romanos dependiam deles, principalmente na <b>agricultura</b>, a <b>produção caiu</b>. A presença de germânicos na Europa e de persas na Ásia Menor piorou o problema.</p>',
        list: [['Gastos', 'exército, fronteiras, obras, <mark>pão e circo</mark>'], ['Sem conquistas', 'sem prisioneiros → <mark>sem escravizados</mark>']],
        memo: '<b>Pão e circo</b> = comida e diversão de graça. Custava caro e esvaziava os cofres!',
        say: 'Roma empobreceu por dois motivos principais. Primeiro, gastava muito: com o exército, a defesa das fronteiras, os prédios públicos e o pão e circo, que era comida e diversão de graça para o povo. Segundo, sem guerras de conquista, faltaram prisioneiros e escravizados, e a produção agrícola caiu.' }), [
        ...lote(1, [
          mc('"Pão e circo" era uma política em que o governo:', ['Dava comida e espetáculos ao povo', 'Cobrava imposto sobre o pão', 'Proibia os espetáculos', 'Construía padarias para os soldados'], 'Pão e circo: o governo oferecia comida e diversão para agradar o povo.'),
          mc('Quais gastos esvaziavam os cofres de Roma?', ['Exército, fronteiras, prédios públicos e espetáculos', 'Escolas para todas as crianças', 'Viagens para a América', 'Salários pagos aos escravizados'], 'Pagar o exército, defender as fronteiras, manter prédios públicos e pagar espetáculos custava muito.'),
          vf('Quanto maior ficava o Império, mais caro era administrar e defender as fronteiras.', true, 'É verdadeiro. Com o crescimento do Império, tudo ficava mais caro.'),
          mc('Por que faltou mão de obra escravizada?', ['As guerras de conquista acabaram e havia menos prisioneiros', 'Uma lei libertou todos os escravizados', 'Os germânicos compraram todos', 'Os romanos não quiseram mais escravos'], 'Sem guerras de conquista, não chegavam prisioneiros de guerra para serem escravizados.'),
          mc('Qual atividade da economia romana mais dependia dos escravizados?', ['A agricultura', 'O comércio de navios', 'As escolas', 'Os templos'], 'A apostila destaca a agricultura como a atividade que mais dependia dos escravizados.'),
          mc('Com menos escravizados, o que aconteceu com a produção agrícola?', ['Caiu', 'Aumentou muito', 'Ficou igual', 'Passou a ser feita por máquinas'], 'Menos trabalhadores no campo = menos produção.'),
          vf('A presença de germânicos na Europa e de persas na Ásia Menor também ajudou a diminuir a produção.', true, 'É verdadeiro. A instabilidade causada por eles contribuiu para o declínio.'),
          mc('Quais foram os principais motivos da crise econômica, segundo a apostila?', ['O empobrecimento do Império e o problema da mão de obra', 'O excesso de ouro e de escravizados', 'A invenção das fábricas', 'A chegada dos vikings'], 'O título da apostila é "Empobrecimento do Império e problema da mão de obra".'),
        ]),
      ]),
      bloco(ex({ title: 'Moeda fraca, fim das conquistas e revoltas',
        body: '<p><b>3. Aumento de preços:</b> entrava <b>menos metal precioso</b> (ouro e prata) no Império. Para manter o <b>comércio</b> e a <b>cobrança de impostos</b>, o governo passou a fazer moedas com <b>menos metal</b>. A moeda <b>perdeu valor</b> e os <b>preços subiram</b> (inflação).</p>'
          + '<p><b>4. Fim da expansão:</b> no <b>século III</b> o Império chegou ao seu <b>tamanho máximo</b>. As fronteiras estavam bloqueadas por <b>povos não conquistados</b> e por <b>obstáculos naturais</b>. As conquistas pararam, e chegavam <b>menos riquezas</b>.</p>'
          + '<p><b>E a plebe?</b> A plebe da cidade e do campo sofria com <b>inflação</b>, <b>fome</b> e <b>impostos altos</b> para sustentar o Império. Pagar era obrigatório. Tudo isso levou às <b>revoltas populares</b>.</p>',
        list: [['Menos metal', 'moeda vale menos → <mark>preços sobem</mark>'], ['Fronteiras bloqueadas', 'fim das conquistas → <mark>menos riqueza</mark>'], ['Fome + impostos', '<mark>revoltas populares</mark>']],
        memo: 'Moeda com <b>menos metal</b> vale <b>menos</b>, e tudo fica <b>mais caro</b>.',
        say: 'Entrava menos metal precioso, então as moedas passaram a ter menos metal e perderam valor. Os preços subiram. No século terceiro o Império chegou ao tamanho máximo, e as conquistas pararam. A plebe sofria com fome, inflação e impostos altos e obrigatórios. Por isso surgiram revoltas populares.' }), [
        ...lote(1, [
          mc('Por que o governo passou a fazer moedas com menos metal precioso?', ['Entrava menos metal precioso no Império', 'O metal foi proibido', 'Para as moedas ficarem mais bonitas', 'Porque o papa mandou'], 'Com a redução da entrada de metais preciosos, as moedas passaram a usar menos metal.'),
          mc('O que aconteceu quando as moedas passaram a ter menos metal?', ['A moeda perdeu valor e os preços subiram', 'A moeda ficou mais valiosa', 'Os preços caíram', 'Os impostos acabaram'], 'A moeda se desvalorizou e os preços aumentaram de forma geral.'),
          mc('Em que século o Império Romano chegou ao seu tamanho máximo?', ['Século III', 'Século I a.C.', 'Século V', 'Século X'], 'No século III, o Império alcançou sua extensão máxima, segundo a apostila. (Alguns livros falam em século II; na prova, use o que a apostila ensina.)'),
          mc('Por que as conquistas romanas pararam?', ['As fronteiras estavam bloqueadas por povos não conquistados e obstáculos naturais', 'Os romanos ficaram sem soldados de uma vez', 'O Senado proibiu as guerras', 'Já tinham conquistado o mundo todo'], 'Povos não conquistados e obstáculos naturais bloqueavam as fronteiras.'),
          mc('Qual foi a consequência do fim da expansão?', ['Menos riquezas chegando a Roma', 'Mais escravizados baratos', 'Mais metais preciosos', 'O fim dos impostos'], 'Sem conquistas, diminuiu o acúmulo de riquezas.'),
          mc('Por que surgiram revoltas populares?', ['Impostos altos e obrigatórios em meio à fome e à inflação', 'O povo queria mais espetáculos', 'O imperador era cristão', 'Os bárbaros mandaram'], 'A obrigação de pagar impostos altos, no meio da crise, levou às revoltas populares.'),
          vf('A crise econômica prejudicou a plebe da cidade e também a do campo.', true, 'É verdadeiro. A apostila fala da plebe urbana e da rural.'),
          mc('Para que serviam os impostos altos cobrados da população?', ['Para sustentar a estrutura do Império', 'Para construir escolas para os pobres', 'Para pagar salário aos escravizados', 'Para comprar terras na Pérsia'], 'Os impostos eram cobrados para sustentar a estrutura do Império.'),
          escrever('Como se chama o aumento geral dos preços?', 'inflação', 'O aumento geral dos preços se chama inflação.'),
          pares('Ligue cada motivo da crise à sua explicação.', [['Gastos do Estado', 'Exército, obras e pão e circo'], ['Crise da mão de obra', 'Menos prisioneiros de guerra'], ['Aumento de preços', 'Moeda com menos metal'], ['Fim da expansão', 'Fronteiras bloqueadas']], 'Esses são os quatro motivos da crise econômica.'),
          mc('O que quer dizer "a moeda se desvalorizou"?', ['Passou a comprar menos coisas', 'Passou a comprar mais coisas', 'Deixou de existir', 'Virou ouro puro'], 'Desvalorizar é perder valor: com a mesma moeda se compra menos.'),
        ]),
      ]),
    ], { cartoes: [['4 motivos da crise econômica', '1. <b>Gastos</b> (exército, obras, pão e circo)<br>2. <b>Falta de escravizados</b><br>3. <b>Aumento de preços</b> (moeda fraca)<br>4. <b>Fim da expansão</b>'], ['Revoltas populares', 'Fome + inflação + <b>impostos altos e obrigatórios</b> = revoltas.']] }),

    licao('cr4', 'A corrente da crise', [
      bloco(ex({ title: 'Um problema puxa o outro',
        body: '<p>A crise de Roma funciona como uma <b>corrente</b>: cada problema causa o seguinte. Entendendo a corrente, você responde qualquer pergunta que peça para <b>relacionar</b> motivos.</p>'
          + '<ul class="ex-list"><li>Fim das conquistas <span class="arrow">→</span> menos prisioneiros <span class="arrow">→</span> menos escravizados <span class="arrow">→</span> cai a produção agrícola <span class="arrow">→</span> fome</li>'
          + '<li>Menos riquezas e metais <span class="arrow">→</span> moeda com menos metal <span class="arrow">→</span> preços sobem (inflação)</li>'
          + '<li>Invasões e guerras <span class="arrow">→</span> regiões param de produzir <span class="arrow">→</span> falta comida e o Estado arrecada menos impostos</li>'
          + '<li>Império enorme <span class="arrow">→</span> gastos altos com exército e fronteiras <span class="arrow">→</span> impostos altos</li>'
          + '<li>Fome + inflação + impostos <span class="arrow">→</span> revoltas populares</li></ul>'
          + '<p><b>Modelo de resposta</b> ("determine dois motivos e relacione"): <i>O fim das guerras de conquista e a falta de mão de obra escravizada. Sem conquistas, não chegavam mais prisioneiros de guerra; por isso faltaram escravizados e a produção agrícola caiu.</i></p>',
        memo: 'Para <b>relacionar</b>, use <b>"por isso"</b>: um motivo causou o outro.',
        say: 'A crise de Roma é uma corrente. Sem conquistas, não chegam prisioneiros, faltam escravizados, a produção cai e vem a fome. Com menos metal, a moeda perde valor e os preços sobem. As invasões param a produção, e falta comida. Os gastos com o exército trazem impostos altos. E a fome, a inflação e os impostos levam às revoltas. Para relacionar dois motivos, ligue um ao outro com a expressão: por isso.' }), [
        ...lote(1, [
          mc('Complete a corrente: fim das conquistas → menos prisioneiros de guerra → o que vem depois?', ['menos escravizados para trabalhar', 'mais escravizados para trabalhar', 'mais metais preciosos', 'fim dos impostos'], 'Prisioneiros de guerra viravam escravizados. Menos prisioneiros = menos escravizados.'),
          mc('Complete a corrente: menos escravizados no campo → o que vem depois?', ['menos produção agrícola e fome', 'mais produção agrícola e fartura', 'mais soldados e vitórias', 'mais moedas e riqueza'], 'Os escravizados trabalhavam na agricultura. Sem eles, a produção caiu e veio a fome.'),
          mc('Complete a corrente: menos metais preciosos → moedas com menos metal → o que vem depois?', ['moeda desvalorizada e preços altos', 'moeda valorizada e preços baixos', 'mais escravizados', 'mais conquistas'], 'Moeda com menos metal vale menos, e os preços sobem.'),
          mc('Complete a corrente: Império enorme → mais gastos com o exército e as fronteiras → o que vem depois?', ['impostos mais altos para a população', 'impostos menores', 'fim do exército', 'mais pão e circo de graça'], 'A apostila diz que pagar o exército e defender as fronteiras ficava cada vez mais caro, e o povo pagava impostos altos para sustentar o Império.'),
          mc('Complete a corrente: fome, inflação e impostos altos → o que vem depois?', ['revoltas populares', 'festas populares', 'o fim da plebe', 'mais conquistas'], 'O peso de tudo isso levou às revoltas populares.'),
          mc('Qual resposta <b>relaciona corretamente</b> dois motivos da crise?', ['O fim das conquistas diminuiu os prisioneiros de guerra; por isso faltou mão de obra escravizada', 'O fim das conquistas aumentou os escravizados; por isso a produção cresceu', 'A falta de escravizados fez as moedas terem mais ouro', 'As invasões diminuíram os gastos com o exército'], 'Sem conquistas não chegavam prisioneiros, e por isso faltaram escravizados. As outras opções dizem o contrário do que aconteceu.'),
          mc('Qual é a melhor resposta para "relacione as invasões com a crise econômica"?', ['As regiões em guerra pararam de produzir, faltou comida e o Estado arrecadou menos impostos', 'As invasões trouxeram mais escravizados e mais riqueza', 'As invasões não tiveram relação com a economia', 'Os invasores pagaram os impostos dos romanos'], 'A guerra parou a produção nas regiões atingidas, faltou comida e os impostos diminuíram.'),
          vf('Os motivos da crise romana se ligam como uma corrente: um problema causava outro.', true, 'É verdadeiro. Por isso a prova pede para relacionar os motivos.'),
          pares('Ligue a causa à consequência.', [['Fim das conquistas', 'Faltam escravizados'], ['Moeda com menos metal', 'Preços sobem'], ['Gastos com o exército', 'Impostos altos'], ['Fome, inflação e impostos', 'Revoltas populares']], 'Essa é a corrente da crise de Roma.'),
          mc('Numa resposta que pede "estabeleça uma relação", o que <b>não pode faltar</b>?', ['Mostrar como um motivo causou ou piorou o outro', 'Só escrever o nome dos dois motivos', 'Desenhar o mapa do Império', 'Copiar o título do capítulo'], 'Relacionar é mostrar a ligação: este motivo causou aquele.'),
          mc('Qual par de motivos tem uma relação direta de causa e consequência?', ['Fim da expansão e falta de escravizados', 'Pão e circo e o rio Reno', 'Os persas e o pão e circo', 'O colonato e o rio Reno'], 'Sem expansão, sem prisioneiros; sem prisioneiros, faltaram escravizados.'),
          mc('Por que a falta de escravizados ajudou o colonato a crescer?', ['Os escravizados ficaram caros, e os donos de terra passaram a receber colonos', 'Os escravizados viraram donos das terras', 'O imperador proibiu o trabalho no campo', 'Os colonos compraram os escravizados'], 'Com escravizados caros, os patrícios passaram a dar abrigo a colonos em troca de trabalho e colheita.'),
        ]),
      ]),
    ], { cartoes: [['A corrente da crise', 'Sem conquistas → sem escravizados → menos produção → fome.<br>Menos metal → moeda fraca → preços altos.<br>Impostos + fome → <b>revoltas</b>.']] }),
  ]),

  /* ============================ 3. CRISTIANISMO E QUEDA DO OCIDENTE ============================ */
  modulo('cristianismo', 'Cristianismo e o fim de Roma', 'De Jesus até 476', 'ambar', [
    licao('cs1', 'Como nasceu o cristianismo', [
      bloco(ex({ title: 'O cristianismo nasce na Palestina',
        body: '<p>O cristianismo surgiu na <b>Palestina</b>, no Oriente Médio, que era <b>domínio romano desde 63 a.C.</b> Lá viviam romanos, gregos, judeus e outros povos.</p>'
          + '<p><b>Jesus Cristo</b>, um <b>judeu de família pobre</b>, propôs uma nova interpretação da lei judaica e pregou <b>igualdade e paz</b> entre os anos <b>30 e 33 d.C.</b> Atraiu principalmente os <b>mais pobres</b>.</p>'
          + '<p>Roma permitia várias religiões, mas os cristãos <b>se recusavam a adorar o imperador</b>. Além disso, acreditavam em <b>um único Deus</b> (monoteísmo), enquanto os romanos acreditavam em <b>vários deuses</b> (politeísmo). Por isso o cristianismo foi visto como uma <b>ameaça à ordem</b>.</p>'
          + '<p>Jesus foi acusado de <b>heresia</b> (ideia contra a religião aceita) e de causar <b>desordem</b>. Foi condenado à <b>crucificação</b> pelos romanos e por parte da elite judaica. Depois, seus <b>discípulos</b> espalharam os ensinamentos pelo mundo romano.</p>',
        list: [['Onde', '<mark>Palestina</mark> (romana desde 63 a.C.)'], ['Quando Jesus pregou', '<mark>30 a 33 d.C.</mark>'], ['Por que perseguido', 'não adorava o imperador']],
        memo: 'Cristão tinha <b>um só Deus</b> e <b>não adorava o imperador</b>. Para Roma, isso era desafio!',
        say: 'O cristianismo nasceu na Palestina, domínio romano desde sessenta e três antes de Cristo. Jesus, um judeu pobre, pregou igualdade e paz entre os anos trinta e trinta e três. Os cristãos acreditavam em um só Deus e se recusavam a adorar o imperador. Por isso foram perseguidos. Jesus foi crucificado, e seus discípulos espalharam os ensinamentos.' }), [
        ...lote(1, [
          mc('Onde surgiu o cristianismo?', ['Na Palestina, no Oriente Médio', 'Em Roma, na Itália', 'Na Germânia, perto do rio Reno', 'Em Constantinopla'], 'O cristianismo teve origem na Palestina, no Oriente Médio.'),
          mc('Desde quando a Palestina era um domínio romano?', ['Desde 63 a.C.', 'Desde 313 d.C.', 'Desde 476 d.C.', 'Desde 1215'], 'A Palestina era domínio romano desde 63 a.C.'),
          mc('Quais povos viviam na Palestina naquela época?', ['Romanos, gregos e judeus, entre outros', 'Só romanos', 'Só germânicos', 'Persas e vikings'], 'A região era habitada por povos de culturas diferentes: romanos, gregos, judeus e outros.'),
          mc('Quem era Jesus Cristo, segundo a apostila?', ['Um judeu de família pobre', 'Um imperador romano', 'Um general germânico', 'Um senador rico'], 'Jesus era um judeu de família pobre.'),
          mc('Entre quais anos Jesus pregou na Palestina?', ['Entre 30 e 33 d.C.', 'Entre 313 e 330 d.C.', 'Entre 63 e 30 a.C.', 'Entre 379 e 395 d.C.'], 'Jesus pregou entre os anos 30 e 33 d.C.'),
          mc('O que Jesus pregava?', ['Igualdade e paz', 'Guerra contra os romanos', 'Adoração ao imperador', 'Pagamento de mais impostos'], 'Jesus pregava mensagens de igualdade e paz.'),
          mc('Quem mais se interessou pelas mensagens de Jesus no começo?', ['Os mais pobres (desfavorecidos)', 'Os imperadores', 'Os generais', 'Os senadores ricos'], 'Ele atraiu principalmente os desfavorecidos da sociedade.'),
          mc('Por que o cristianismo foi visto como uma ameaça pelos romanos?', ['Os cristãos se recusavam a adorar o imperador', 'Os cristãos se aliaram aos persas', 'Os cristãos queriam destruir Roma com armas', 'Os cristãos falavam outra língua'], 'A recusa em adorar o imperador foi vista como ameaça à ordem.'),
          mc('Os cristãos acreditavam em um único Deus. E os romanos?', ['Eram politeístas (acreditavam em vários deuses)', 'Eram monoteístas (um único Deus)', 'Não acreditavam em deuses', 'Já eram cristãos'], 'A cultura romana era politeísta, com muitos deuses.'),
          vf('Roma permitia várias religiões, mas perseguiu o cristianismo porque os cristãos não adoravam o imperador.', true, 'É verdadeiro. Mesmo com liberdade religiosa, a recusa em adorar o imperador gerou conflito.'),
          mc('De que Jesus foi acusado?', ['De heresia e de causar desordem', 'De roubar o tesouro de Roma', 'De trair os persas', 'De não pagar o pão e circo'], 'Jesus foi acusado de heresia (ir contra a religião aceita) e de incitar, ou seja, provocar, desordem.'),
          mc('A que pena Jesus foi condenado?', ['À crucificação', 'À prisão numa ilha', 'Ao exílio na Germânia', 'A trabalhar como escravo'], 'Jesus foi condenado à crucificação.'),
          mc('Quem condenou Jesus, segundo a apostila?', ['Os romanos e parte da elite judaica', 'Os germânicos', 'Os persas', 'Constantino'], 'A apostila diz que ele foi condenado pelos romanos e por parte da elite judaica.'),
          mc('O que os discípulos fizeram depois da morte de Jesus?', ['Espalharam os ensinamentos pelo mundo romano', 'Esqueceram os ensinamentos', 'Montaram um exército contra Roma', 'Mudaram-se para a América'], 'Os discípulos se espalharam e difundiram os ensinamentos aos poucos.'),
          pares('Ligue a palavra ao significado.', [['Monoteísmo', 'Crença em um único Deus'], ['Politeísmo', 'Crença em vários deuses'], ['Heresia', 'Ideia contra a religião aceita'], ['Discípulos', 'Seguidores de Jesus']], 'Mono = um; poli = vários. Heresia é uma ideia que vai contra a religião aceita. Discípulos são os seguidores de Jesus.'),
          escrever('Em que região surgiu o cristianismo?', ['Palestina', 'na Palestina'], 'O cristianismo surgiu na Palestina.'),
        ]),
      ]),
    ], { cartoes: [['Origem do cristianismo', '<b>Palestina</b>, domínio romano desde <b>63 a.C.</b><br>Jesus pregou de <b>30 a 33 d.C.</b>: igualdade e paz.'], ['Por que foi perseguido', 'Cristãos <b>não adoravam o imperador</b> e tinham <b>um só Deus</b> (Roma era politeísta).']] }),

    licao('cs2', 'O cristianismo cresce na crise', [
      bloco(ex({ title: 'Na crise, a fé cresce',
        body: '<p>No <b>século III</b>, com a crise e o sofrimento, muitos romanos encontraram <b>refúgio</b> no cristianismo.</p>'
          + '<p>Além dos <b>pobres</b> e dos <b>escravizados</b>, a religião atraiu gente da <b>elite</b>, principalmente <b>mulheres ricas e seus filhos</b>, que viam nela uma chance de <b>valorização</b>.</p>'
          + '<p>O cristianismo prometia <b>felicidade eterna após a morte</b> para quem fizesse o bem. Em tempos de incerteza, isso atraía muita gente.</p>'
          + '<p>Com a conversão de <b>famílias ricas</b>, a <b>perseguição</b> aos cristãos foi ficando <b>mais rara e mais difícil</b>.</p>',
        memo: 'Tempo de <b>sofrimento</b> = mais gente buscando <b>esperança</b>. Por isso a fé cresceu na crise.',
        say: 'No século terceiro, com a crise, muitos romanos encontraram refúgio no cristianismo. Pobres, escravizados e também mulheres ricas e seus filhos se converteram. A religião prometia felicidade eterna depois da morte para quem fizesse o bem. Com famílias ricas cristãs, a perseguição foi ficando mais rara.' }), [
        ...lote(1, [
          mc('Por que muitos romanos procuraram o cristianismo na crise do século III?', ['Encontraram refúgio nos seus ensinamentos em meio ao sofrimento', 'O imperador obrigou todos a virar cristãos', 'Quem se convertia ganhava terras', 'Os persas eram cristãos'], 'Em meio à crise e às dificuldades, muitos encontraram refúgio no cristianismo.'),
          mc('Além de pobres e escravizados, quem mais se converteu?', ['Pessoas da elite, principalmente mulheres ricas e seus filhos', 'Só os soldados', 'Só os imperadores', 'Mais ninguém'], 'A apostila destaca a conversão de mulheres ricas e de seus filhos.'),
          mc('Por que mulheres ricas se interessaram pelo cristianismo?', ['Viam na religião uma oportunidade de valorização', 'Queriam pagar menos impostos', 'Queriam virar imperatrizes', 'Queriam ir embora de Roma'], 'Elas viam na religião uma oportunidade de valorização.'),
          mc('O que o cristianismo prometia a quem praticasse o bem?', ['Felicidade eterna após a morte', 'Muito ouro ainda em vida', 'Um cargo no Senado', 'Terras na Palestina'], 'A promessa era de felicidade eterna após a morte.'),
          mc('O que aconteceu com a perseguição quando famílias ricas se converteram?', ['Ficou cada vez mais rara e difícil', 'Ficou muito mais forte', 'Continuou igual', 'Passou a ser feita pelos persas'], 'Com famílias ricas cristãs, perseguir os cristãos ficou mais raro e mais difícil.'),
          vf('Durante a crise de Roma, o cristianismo ganhou muitos seguidores.', true, 'É verdadeiro. A crise ajudou o cristianismo a crescer.'),
          vf('O cristianismo atraiu só os pobres, nunca os ricos.', false, 'Falso. Ele também atraiu a elite, principalmente mulheres ricas e seus filhos.'),
          mc('Qual frase explica bem o crescimento do cristianismo no século III?', ['Em tempos de incerteza e sofrimento, a promessa de salvação atraía muita gente', 'Ele cresceu porque já era a religião oficial', 'Ele cresceu porque Jesus era imperador', 'Ele cresceu porque proibiu o casamento'], 'As incertezas da época faziam muita gente buscar a esperança que o cristianismo oferecia.'),
          mc('Quais grupos sofredores encontraram consolo no cristianismo?', ['Os pobres e os escravizados', 'Os generais vitoriosos', 'Os imperadores', 'Os senadores mais ricos'], 'Na crise do século III, os pobres e os escravizados encontraram refúgio no cristianismo.'),
          escrever('Complete: com a conversão de famílias ricas, a ____ aos cristãos se tornou mais rara.', 'perseguição', 'A perseguição aos cristãos foi ficando mais rara.'),
          mc('Em que século o cristianismo ganhou muitos seguidores por causa da crise?', ['Século III', 'Século I a.C.', 'Século X', 'Século XV'], 'Foi durante a crise do século III.'),
        ]),
      ]),
    ], { cartoes: [['Por que o cristianismo cresceu', 'Crise e sofrimento → busca de <b>refúgio</b>.<br>Promessa de <b>felicidade eterna</b>.<br>Pobres, escravizados e também a elite (<b>mulheres ricas</b> e seus filhos).']] }),

    licao('cs3', 'Constantino', [
      bloco(ex({ title: 'Mais impostos e um imperador cristão',
        body: '<p>Para enfrentar as <b>revoltas</b>, o Estado usou <b>forte repressão</b> e <b>centralizou o poder</b>. Isso custava caro: o governo <b>aumentou os impostos</b> e obrigou o povo a pagar. A população passou a ver o <b>Estado como inimigo</b>.</p>'
          + '<p>No início do <b>século IV</b>, o general <b>Constantino</b>, com forte apoio do <b>Exército</b>, venceu seus adversários e tomou o poder.</p>'
          + '<p>Nessa época os cristãos <b>já eram muitos</b>. Por razões <b>sobretudo políticas</b>, para ganhar o apoio desse grande grupo, Constantino se tornou o <b>primeiro imperador romano a se converter</b> ao cristianismo, dizendo ter tido visões ligadas a essa religião.</p>'
          + '<p>Ele contou que sonhou, na véspera de uma batalha, com uma <b>cruz</b> e a frase <b>"Sob este signo vencerás"</b> (signo quer dizer sinal). Mandou pôr o símbolo nos <b>escudos dos soldados</b>, venceu a batalha e anunciou sua conversão.</p>',
        list: [['Revoltas', 'repressão → <mark>mais impostos</mark> → Estado visto como inimigo'], ['Constantino', 'general, <mark>1º imperador cristão</mark>'], ['Sonho', '<mark>"Sob este signo vencerás"</mark>']],
        memo: 'Constantino viu a cruz: <b>"Sob este signo vencerás"</b>. Pôs nos escudos e venceu!',
        say: 'Para combater as revoltas, o governo usou repressão e aumentou os impostos, e o povo passou a ver o Estado como inimigo. No século quarto, o general Constantino tomou o poder com apoio do exército. Por razões principalmente políticas, ele foi o primeiro imperador a se converter ao cristianismo. Ele disse ter sonhado com uma cruz e a frase: sob este signo vencerás.' }), [
        ...lote(1, [
          mc('Como o Estado romano reagiu às revoltas do século III?', ['Com forte repressão e centralização do poder', 'Diminuindo os impostos', 'Dando mais poder ao povo', 'Libertando todos os escravizados'], 'O Estado recorreu à repressão dos revoltosos e à centralização do poder.'),
          mc('Como o governo conseguiu dinheiro para a repressão?', ['Aumentando os impostos e obrigando o povo a pagar', 'Vendendo terras aos persas', 'Pedindo dinheiro aos germânicos', 'Fechando os templos'], 'O governo aumentou os impostos e obrigou o povo a pagar.'),
          mc('Qual foi a consequência da opressão e dos impostos altos?', ['A população passou a ver o Estado como inimigo', 'A população ficou mais rica', 'O povo apoiou ainda mais o governo', 'Os impostos acabaram'], 'O peso dos impostos fez a população enxergar o Estado como um inimigo.'),
          mc('Quem era Constantino antes de virar imperador?', ['Um general com forte apoio do Exército', 'Um escravo liberto', 'Um rei germânico', 'Um papa'], 'Constantino era um general apoiado pelo Exército.'),
          mc('Por que Constantino se converteu ao cristianismo, segundo a apostila?', ['Sobretudo por razões políticas: os cristãos já eram muitos', 'Porque nasceu cristão', 'Porque perdeu uma batalha', 'Porque os persas obrigaram'], 'Os cristãos eram muitos; converter-se dava a ele o apoio desse grupo. Foram razões sobretudo políticas.'),
          mc('Qual frase Constantino disse ter visto no sonho, junto com uma cruz?', ['"Sob este signo vencerás"', '"Vim, vi e venci"', '"Pão e circo"', '"Todos os caminhos levam a Roma"'], 'A frase do sonho foi "Sob este signo vencerás".'),
          mc('Onde Constantino mandou colocar o símbolo do sonho?', ['Nos escudos dos soldados', 'Nas portas do Senado', 'Na bandeira dos persas', 'Nas paredes de Jerusalém'], 'Ele usou o símbolo nos escudos dos soldados e venceu a batalha.'),
          vf('Constantino foi o primeiro imperador romano a se converter ao cristianismo.', true, 'É verdadeiro. A apostila diz que ele foi o primeiro.'),
          mc('Em que época Constantino tomou o poder?', ['No início do século IV d.C.', 'No século I a.C.', 'No século VIII', 'No ano 476'], 'Constantino tomou o poder no início do século IV d.C.'),
          mc('O que aconteceu depois que Constantino venceu a batalha com o símbolo nos escudos?', ['Ele revelou ao povo que tinha se convertido', 'Ele proibiu o cristianismo', 'Ele dividiu o Império', 'Ele foi deposto'], 'Depois da vitória, ele contou à população sua conversão ao cristianismo.'),
        ]),
      ]),
      bloco(ex({ title: 'Édito de Milão (313) e Constantinopla (330)',
        body: '<p>Em <b>313</b>, pelo <b>Édito de Milão</b>, Constantino deu <b>liberdade de culto</b> aos cristãos e acabou com séculos de perseguição (édito é uma ordem oficial do governante).</p>'
          + '<p>A Igreja passou a ser <b>privilegiada</b>: ganhou <b>terras</b>, <b>templos</b>, <b>isenção de impostos</b> e <b>cargos públicos</b>. Mas a união entre <b>Igreja e Estado</b> também fez o <b>imperador interferir</b> nos assuntos religiosos. E os problemas do Estado <b>não diminuíram</b>.</p>'
          + '<p>Em <b>330</b>, Constantino <b>mudou a capital</b> para <b>Bizâncio</b>, rebatizada de <b>Constantinopla</b>, para governar longe da agitada Roma. Os senadores do Oriente eram, na maioria, <b>cristãos e de origem modesta</b>. Já os aristocratas de Roma <b>resistiam ao cristianismo</b> para proteger seu poder e a cultura romana.</p>',
        list: [['313', '<mark>Édito de Milão</mark>: liberdade de culto'], ['330', 'capital em <mark>Constantinopla</mark> (antiga Bizâncio)']],
        memo: '<b>313</b> = liberdade (Milão). <b>330</b> = capital nova (Constantinopla). Os dois são do <b>C</b>onstantino!',
        say: 'Em trezentos e treze, com o Édito de Milão, Constantino deu liberdade de culto aos cristãos. A Igreja ganhou terras, templos, isenção de impostos e cargos públicos, mas o imperador passou a interferir na religião. Em trezentos e trinta, ele mudou a capital para Bizâncio, que passou a se chamar Constantinopla.' }), [
        ...lote(1, [
          mc('O que foi o <b>Édito de Milão</b>?', ['A ordem que deu liberdade de culto aos cristãos', 'A ordem que dividiu o Império', 'A ordem que tornou o cristianismo religião oficial', 'A ordem que criou o feudalismo'], 'O Édito de Milão deu liberdade de culto aos cristãos e acabou com as perseguições.'),
          escrever('Em que ano Constantino deu liberdade de culto aos cristãos pelo Édito de Milão?', ['313', '313 d.C.'], 'O Édito de Milão é de 313.'),
          mc('O que a Igreja recebeu depois do Édito de Milão?', ['Terras, templos, isenção de impostos e cargos públicos', 'Um exército para invadir a Pérsia', 'O direito de escolher o imperador', 'Nada, continuou perseguida'], 'O cristianismo virou a religião mais privilegiada, com terras, templos, isenções e cargos públicos.'),
          mc('Qual foi o lado negativo da união entre Igreja e Estado começada por Constantino?', ['O imperador passou a interferir nos assuntos religiosos', 'A Igreja passou a cobrar impostos dos persas', 'Os cristãos foram proibidos de rezar', 'O Senado virou uma igreja'], 'A apostila diz que houve interferência direta do poder imperial nos assuntos religiosos.'),
          vf('Depois da conversão de Constantino, os problemas do Estado romano acabaram.', false, 'Falso. A apostila diz que os problemas para governar o Império não diminuíram.'),
          mc('Para qual cidade Constantino levou a capital do Império em 330?', ['Bizâncio, que passou a se chamar Constantinopla', 'Milão', 'Jerusalém', 'Cartago'], 'A capital foi para Bizâncio, rebatizada como Constantinopla.'),
          mc('Por que Constantino quis governar de uma nova capital?', ['Para ficar longe da agitada Roma', 'Porque Roma foi destruída por um vulcão', 'Porque os persas pediram', 'Para ficar perto dos germânicos'], 'Ele buscou uma nova sede distante da agitada Roma.'),
          mc('Quem resistia ao cristianismo para manter o poder e a cultura romana?', ['Os aristocratas de Roma', 'Os senadores do Oriente', 'Os escravizados', 'Os colonos'], 'Os aristocratas de Roma resistiam ao cristianismo.'),
          mc('Como eram, na maioria, os senadores do Oriente?', ['Cristãos e de origem modesta', 'Politeístas e muito ricos', 'Todos germânicos', 'Todos persas'], 'Os senadores do Oriente eram, na maioria, cristãos e de origem modesta.'),
          escrever('Em que ano a capital do Império foi transferida para Constantinopla?', ['330', '330 d.C.'], 'A capital foi transferida em 330.'),
          mc('Qual era o nome antigo de Constantinopla?', ['Bizâncio', 'Milão', 'Ravena', 'Palestina'], 'Constantinopla era a antiga Bizâncio.'),
          pares('Ligue a data ao fato.', [['313', 'Édito de Milão'], ['330', 'Capital em Constantinopla'], ['Início do século IV', 'Constantino toma o poder']], 'As três datas são do tempo de Constantino.'),
        ]),
      ]),
    ], { cartoes: [['Constantino', 'General, <b>1º imperador cristão</b> (razões políticas).<br>"Sob este signo vencerás".'], ['313 e 330', '<b>313</b>: Édito de Milão (liberdade de culto).<br><b>330</b>: capital em Constantinopla.']] }),

          mc('Em que período Teodósio governou?', ['379-395 d.C.', '30-33 d.C.', '768-814 d.C.', '481-751 d.C.'], 'Teodósio governou de 379 a 395 d.C.'),

          mc('O que Teodósio fez em 395 d.C.?', ['Dividiu o Império entre seus filhos', 'Levou a capital para Bizâncio', 'Deu liberdade de culto aos cristãos', 'Saqueou Roma'], 'Em 395, Teodósio dividiu o Império entre os filhos.'),
          mc('Qual era a sede do Império Romano do <b>Ocidente</b>, segundo a apostila?', ['Roma', 'Constantinopla', 'Jerusalém', 'Alexandria'], 'A apostila diz: Ocidente com sede em Roma.'),
          mc('Qual era a sede do Império Romano do <b>Oriente</b>?', ['Constantinopla', 'Roma', 'Milão', 'Cartago'], 'O Oriente tinha sede em Constantinopla.'),
          mc('Pelo mapa da apostila, quem ficou com cada parte do Império em 395?', ['Honório com o Ocidente e Arcádio com o Oriente', 'Honório com o Oriente e Arcádio com o Ocidente', 'Constantino com o Oriente e Teodósio com o Ocidente', 'Carlos Magno com as duas partes'], 'O mapa mostra a divisão entre Arcádio (Oriente) e Honório (Ocidente).'),

        list: [['Idade Média', 'séculos <mark>V a XV</mark> (começa em 476)'], ['Alta', 'séculos <mark>V a X</mark>'], ['Baixa', 'séculos <mark>XI a XV</mark>']],

    licao('fd4', 'Ruralização e servilização', [

        ...lote(1, [
          mc('O que foi a <b>ruralização</b>?', ['A ida das pessoas das cidades para o campo', 'O crescimento das cidades', 'A volta do Império Romano', 'A construção de estradas'], 'Ruralização é o movimento em direção ao campo.'),
          mc('Qual imperador romano fez reformas que prenderam os camponeses à terra?', ['Constantino I', 'Teodósio', 'Carlos Magno', 'Clóvis'], 'Constantino I promoveu reformas que fixaram os camponeses à terra.'),
          mc('Por que muitas pessoas livres buscaram refúgio com os senhores feudais?', ['Insegurança e fome nas cidades', 'As cidades ficaram ricas demais', 'Queriam virar nobres', 'Queriam estudar nos mosteiros'], 'Fugindo da insegurança e da fome nas cidades, buscaram refúgio no campo.'),
          mc('Qual expansão abalou o comércio europeu no Mar Mediterrâneo?', ['A expansão do Islã', 'A expansão viking na América', 'A expansão do Império Romano', 'A expansão da burguesia'], 'A expansão do Islã teve impacto profundo no comércio do Mediterrâneo.'),
          mc('O que aconteceu com as cidades durante a ruralização?', ['Perderam importância como centros de comércio', 'Ficaram cada vez maiores', 'Viraram feudos do papa', 'Não mudaram'], 'As cidades perdiam importância como centros comerciais.'),
          mc('O que foi a <b>servilização</b>?', ['Homens livres perderam a liberdade e viraram servos presos à terra', 'Os servos ganharam a liberdade', 'Os nobres viraram servos', 'Os escravizados viraram reis'], 'Na servilização, homens antes livres viraram servos presos à terra.'),
          mc('O que acontecia com o servo quando a terra passava para outro senhor?', ['O servo passava junto, para o novo senhor', 'O servo era vendido no mercado', 'O servo virava dono da terra', 'O servo era expulso'], 'O servo passava a ter um novo senhor, junto com a terra.'),
          mc('Qual frase sobre os servos está <b>certa</b>?', ['Não podiam ser vendidos, mas também não podiam deixar a terra', 'Podiam ser vendidos como escravos', 'Podiam ir embora quando quisessem', 'Eram donos das terras'], 'Os servos não podiam ser vendidos, trocados ou expulsos, nem deixar a terra.'),
          mc('Os servos eram obrigados a prestar serviço militar?', ['Não, as guerras eram dos senhores', 'Sim, todos eram soldados', 'Só no verão', 'Só os mais velhos'], 'Os servos não tinham a obrigação de prestar serviço militar; as guerras eram decididas pelos senhores.'),
          mc('Qual era a principal função dos servos no feudo?', ['O trabalho produtivo (cultivar a terra)', 'Lutar nas guerras', 'Governar o feudo', 'Rezar nos mosteiros'], 'Os servos eram responsáveis por todo o trabalho produtivo do feudo.'),
          vf('A organização feudal tinha muita desigualdade entre senhores e servos.', true, 'É verdadeiro. A apostila diz que a desigualdade é consequência da organização feudal.'),
          mc('Servo medieval ou escravo romano: qual é a diferença certa?', ['O servo era preso à terra, mas não podia ser vendido; o escravo podia ser vendido', 'Os dois podiam ser vendidos', 'O servo podia ir embora quando quisesse', 'Não havia diferença'], 'O servo não podia ser vendido, mas não podia deixar a terra. O escravo era uma propriedade que podia ser vendida.'),
          pares('Ligue a palavra ao significado.', [['Ruralização', 'Ir da cidade para o campo'], ['Servilização', 'Livres viram servos presos à terra'], ['Senhor feudal', 'Dono da terra e do poder local']], 'Ruralização é ir para o campo; servilização é virar servo.'),
          escrever('Como se chama o movimento das pessoas das cidades para o campo?', 'ruralização', 'Esse movimento se chama ruralização.'),
        ]),
      ]),
    ], { cartoes: [['Ruralização', 'Fome, insegurança e Islã no Mediterrâneo → gente vai <b>para o campo</b>; cidades perdem importância.'], ['Servilização', 'Livres viram <b>servos presos à terra</b>. Não podem ser vendidos nem sair. Não vão à guerra.']] }),

    licao('fd5', 'As obrigações dos servos', [

          mc('Qual obrigação era entregar parte de tudo o que o servo produzia no manso servil?', ['Talha', 'Corveia', 'Hospedagem', 'Mão morta'], 'Parte da produção do manso servil: talha.'),
          mc('Qual obrigação era pagar para usar o moinho, o forno e o lagar do senhor?', ['Banalidades', 'Capitação', 'Corveia', 'Dízimo'], 'Pagar para usar moinho, forno e lagar: banalidades.'),

          mc('O que era o <b>dízimo</b>?', ['10% da produção, dados à Igreja', 'Metade da produção, dada ao rei', 'Trabalho de graça no castelo', 'Imposto para usar o moinho'], 'O dízimo correspondia a 10% da produção, doados à Igreja.'),
          mc('Para quem ia o dízimo?', ['Para a Igreja', 'Para o senhor feudal', 'Para o rei da França', 'Para os vikings'], 'O dízimo era pago à Igreja.'),
          mc('Qual era a consequência de tantas obrigações?', ['Sobrava pouco para os servos sobreviverem', 'Os servos ficavam ricos', 'Os servos viravam nobres', 'Os senhores ficavam pobres'], 'Sobrava pouco para a sobrevivência dos servos.'),
          vf('Por causa das condições difíceis, a maioria das crianças servas não chegava à idade adulta.', true, 'É verdadeiro. A apostila diz que a expectativa de vida era baixa e que a maioria das crianças não chegava à idade adulta.'),
          mc('Na corveia, além de trabalhar na terra, os servos também consertavam:', ['Estradas, pontes e diques', 'Navios vikings', 'Templos persas', 'Computadores'], 'A corveia incluía consertos de estradas, pontes, diques e outras dependências do feudo.'),
          pares('Ligue a obrigação ao que era.', [['Corveia', 'Trabalho de graça nas terras do senhor'], ['Talha', 'Parte da produção do manso servil'], ['Banalidades', 'Pagar para usar moinho e forno'], ['Dízimo', '10% para a Igreja']], 'Corveia é trabalho; talha é parte da produção; banalidades é pagar pelo uso; dízimo é da Igreja.'),
          pares('Ligue a obrigação ao que era.', [['Capitação', 'Imposto por pessoa da família'], ['Mão morta', 'Taxa após a morte do servo'], ['Hospedagem', 'Dar casa ao senhor em viagem']], 'Capitação vem de "cabeça": um imposto por pessoa.'),
          tap('corveia castelo talha dízimo vassalo banalidades feudo capitação', [0, 2, 3, 5, 7], 'Corveia, talha, dízimo, banalidades e capitação são obrigações. Castelo, vassalo e feudo não são.', { q: 'Toque em TODAS as obrigações dos servos.' }),

    licao('fd6', 'Sociedade estamental e as mulheres', [
      bloco(ex({ title: 'Quem nasce servo, morre servo',
        body: '<p>No feudalismo, a posição social era decidida pela <b>posse da terra</b>. De um lado, os <b>senhores</b> (nobreza e alto clero), donos das terras. Do outro, os <b>servos</b>, sem chance de subir de vida. Quem nascia servo <b>morria servo</b>.</p>'

          + '<li><b>Nobreza e alto clero</b> <span class="arrow">→</span> donos das terras, com os mesmos direitos e a mesma origem social<small>alta nobreza (reis, duques, marqueses, condes) e alto clero (papa, cardeais, arcebispos, bispos, abades). Recebiam os tributos dos servos.</small></li>'

        ...lote(1, [
          mc('O que decidia a posição social no feudalismo?', ['A posse da terra', 'O dinheiro do comércio', 'O estudo', 'A idade'], 'A diferenciação social era determinada pela posse da terra.'),
          mc('O que é uma <b>sociedade estamental</b>?', ['Sociedade dividida pelo nascimento, sem mobilidade social', 'Sociedade em que é fácil subir de vida', 'Sociedade sem classes', 'Sociedade governada por comerciantes'], 'Sociedade estamental: grupos definidos pelo nascimento, sem mobilidade social.'),

          mc('Quem ficava no topo da pirâmide feudal mostrada na apostila?', ['O rei', 'Os servos', 'Os cavaleiros', 'Os vilões'], 'Na pirâmide da apostila, o rei está no topo.'),
          hEst('Duques, marqueses e condes.', 0, 'Duques, marqueses e condes eram a alta nobreza.'),
          hEst('Papa, cardeais, arcebispos, bispos e abades.', 0, 'Esses formavam o alto clero.'),
          hEst('Viscondes, barões e cavaleiros.', 1, 'Viscondes, barões e cavaleiros eram a baixa nobreza, junto com o baixo clero.'),
          hEst('Padres e monges de origem humilde.', 1, 'Padres e monges de origem humilde formavam o baixo clero.'),
          hEst('Ficavam na base da pirâmide e cultivavam a terra.', 2, 'Na base estavam os servos e os vilões.'),
          mc('Qual era a diferença dos vilões em relação aos servos?', ['Tinham menos obrigações e podiam deixar a terra', 'Eram donos de castelos', 'Eram padres', 'Não trabalhavam'], 'Os vilões tinham obrigações menos pesadas e a liberdade de deixar a terra.'),
          mc('Quem recebia os tributos pagos pelos servos?', ['A nobreza e o alto clero', 'Os vilões', 'Os outros servos', 'Ninguém'], 'A nobreza e o alto clero recebiam os tributos dos servos.'),
        ]),
      ]),
      bloco(ex({ title: 'As mulheres no feudalismo',
        body: '<p>A sociedade feudal era <b>patriarcal</b>: os homens tinham o poder, e as mulheres ocupavam posições <b>subordinadas</b>.</p>'

          + '<p>As mulheres <b>camponesas</b> tinham uma vida <b>difícil</b>, com trabalho pesado no <b>campo</b> e em <b>casa</b>, cuidando das plantações e dos animais. Seu trabalho era <b>vital</b> para a economia rural.</p>'
          + '<p>Mesmo assim, algumas mulheres <b>exerceram o poder</b>: quando o marido estava <b>ausente</b> ou impossibilitado, elas administravam, julgavam e, às vezes, até pegavam em armas. Quando o herdeiro homem era <b>jovem demais</b>, governavam no lugar dele como <b>regentes</b>. Eram <b>elogiadas</b> pela força, moderação e coragem, mas vistas como <b>exceções</b>. As mulheres também tiveram presença rica na vida <b>cultural e espiritual</b>.</p>',
        memo: '<b>Patriarcal</b> vem de "pai": quem mandava eram os <b>homens</b>.',

          mc('O que significa dizer que a sociedade feudal era <b>patriarcal</b>?', ['Os homens tinham o poder e as mulheres eram subordinadas', 'As mulheres mandavam em tudo', 'Todos eram iguais', 'Só os idosos mandavam'], 'Patriarcal: o poder ficava com os homens.'),

          mc('Em que situação uma mulher podia exercer o poder no feudalismo?', ['Quando o marido estava ausente ou o herdeiro era jovem demais', 'Nunca, em nenhuma situação', 'Só se fosse serva', 'Só se fosse estrangeira'], 'Elas assumiam no lugar de um esposo ausente ou como regentes de um herdeiro jovem.'),
          mc('Quando assumiam o poder, o que essas mulheres podiam fazer?', ['Administrar, julgar e até pegar em armas', 'Apenas cozinhar', 'Apenas rezar', 'Nada'], 'A apostila diz que elas eram levadas a administrar, julgar e, às vezes, pegar em armas.'),

<script>

});

/* ---------- estatística por pergunta (por criança) ---------- */
const st = q => D.q[q.id];
const vista = q => !!st(q);
const dominada = q => { const s = st(q); return !!s && (s.s >= 2 || (s.s >= 1 && s.e === 0)); };
const pendente = q => { const s = st(q); return !!s && s.ul === 0; };
function prioridade(q) { const s = st(q); return !s ? 0 : s.ul === 0 ? 1 : !dominada(q) ? 2 : 3; }
// ordem de escolha: alguns erros antigos primeiro (para fixar), depois as nunca vistas, depois as menos firmes
function escolher(lista, n) {
  const ord = lista.map(q => ({ q, p: prioridade(q), u: (st(q) || {}).u || 0, r: Math.random() }))
    .sort((a, b) => a.p - b.p || a.u - b.u || a.r - b.r);
  const erros = ord.filter(x => x.p === 1).slice(0, Math.max(1, Math.floor(n / 4)));
  return [...erros, ...ord.filter(x => !erros.includes(x))].slice(0, n).map(x => x.q);
}
function registrar(q, ok) {
  const s = D.q[q.id] || (D.q[q.id] = { v: 0, c: 0, e: 0, s: 0, ul: 1, u: 0 });

}

const novasDe = l => l.todas.filter(q => !vista(q)).length;
