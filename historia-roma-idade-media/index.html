  const firstOpen = LICOES.find(l => !D.licoes[l.id]);
  const nPend = pendentes().length, ofs = ofensiva(P.id), hojePts = pontosHoje(P.id);
  const algumaAtividade = Object.keys(D.q).length > 0;
  const novasLote = algumaAtividade && D.loteVisto < LOTE_MAX ? TODAS.filter(q => (q.lote || 1) > D.loteVisto && !vista(q)).length : 0;
  const naoVistas = TODAS.filter(q => !vista(q)).length;
  const prova = textoProva(M.prova);
  let h = `<div class="top"><button class="chip-perfil" id="troca" aria-label="Trocar de criança">${avatar(P, 40)}<span class="hello">Oi, ${N()}!</span></button>
    <div class="pills"><span class="pill" title="Dias seguidos estudando">${ICON.fire}${ofs}</span><span class="pill" title="Pontos">${ICON.bolt}${D.xp}</span><span class="pill" title="Estrelas">${STAR(true)}${totalEstrelas()}</span></div></div>
  <div class="hero card"><div class="hero-t"><div><div class="hero-m">${esc(M.titulo)} <span>${esc(M.serie || '')}</span></div>${prova ? `<div class="prova">${ICON.cal}${prova}</div>` : ''}</div>
    <div class="meta"><div class="meta-l"><b>Meta do dia</b><span>${Math.min(hojePts, META_DIA)}/${META_DIA}</span></div><div class="prog small"><i style="width:${Math.min(100, hojePts / META_DIA * 100)}%;background:${hojePts >= META_DIA ? 'var(--gold)' : 'var(--ok)'}"></i></div></div></div></div>`;
  if (!GRAVOU_OK) h += `<div class="aviso" style="border-color:var(--oops)">${tico('oops', 54)}<div><b>Não estou conseguindo salvar o progresso neste aparelho.</b><br>Pode ser o modo privado do navegador. Peça ajuda a um adulto.</div></div>`;
  if (novasLote) h += `<div class="aviso novo">${tico('cheer', 54)}<div><b>Chegaram ${novasLote} perguntas novas!</b><br>Elas já estão misturadas nas lições.</div></div>`;
  else if (algumaAtividade && naoVistas === 0) h += `<div class="aviso">${tico('think', 54)}<div><b>Você já viu todas as perguntas!</b><br>Continue treinando os erros e peça a um adulto um lote novo.</div></div>`;
  h += `<div class="acoes">
    <button class="btn" id="treino">Treino do dia</button>
    <button class="btn ${nPend ? 'oops' : 'ghost'}" id="rev" ${nPend ? '' : 'disabled'}>Revisar erros${nPend ? ' (' + nPend + ')' : ''}</button>
    <button class="btn ghost" id="cart" ${CARTOES.length ? '' : 'disabled'}>Cartões das regras</button>
    <button class="btn ghost" id="res" ${M.resumo ? '' : 'disabled'}>Resumão</button></div>`;
  M.modulos.forEach(m => {
    h += `<section class="mod" style="${varsCor(m.c)}"><div class="mod-head"><span class="num">${m.n}</span><div><h2>${m.nome}</h2><p>${m.desc || ''}</p></div></div><div class="trail">`;
    m.licoes.forEach((l, i) => {
      const d = D.licoes[l.id], pct = Math.round(dominadasDe(l) / l.todas.length * 100), nv = novasDe(l);
      h += `<div class="node"><button class="dot ${d ? 'done' : ''}" style="${anel(pct, m.c[0])}" data-l="${l.id}" aria-label="Lição ${esc(l.titulo)}"><span class="dot-in" style="background:${m.c[0]}">${d && pct === 100 ? ICON.check : i + 1}</span></button>
      <div class="node-label"><b>${l.titulo}</b>${d ? `<div class="stars">${STAR(d.estrelas >= 1)}${STAR(d.estrelas >= 2)}${STAR(d.estrelas >= 3)}</div>` : ''}
      <small class="sub">${l === firstOpen && !d ? '<span class="aqui">COMECE AQUI</span>' : d ? `${pct}% dominado${nv ? ` · ${nv} nova${nv > 1 ? 's' : ''}` : ''}` : `${l.todas.length} perguntas`}</small></div></div>`;
    });
    h += `</div></section>`;
  });
  const sd = D.licoes.simulado, ultimo = D.simulados[D.simulados.length - 1];
  h += `<section class="mod" style="${varsCor(SIM.mod.c)}"><div class="mod-head" style="background:var(--ink)"><span class="num">!</span><div><h2>${esc(M.simulado.titulo)}</h2><p>${M.simulado.quantas} perguntas de tudo, com nota no fim</p></div></div>
  <div class="trail"><div class="node final"><button class="dot" data-l="simulado" aria-label="${esc(M.simulado.titulo)}"><span class="dot-in" style="background:var(--gold)">${ICON.trophy}</span></button><div class="node-label"><b>Fazer o simulado</b>${sd ? `<div class="stars">${STAR(sd.estrelas >= 1)}${STAR(sd.estrelas >= 2)}${STAR(sd.estrelas >= 3)}</div>` : ''}<small class="sub">${ultimo ? `Última nota: ${ultimo.nota.toFixed(1).replace('.', ',')}` : 'Faça depois das lições'}</small></div></div></div></section>
  <section class="settings"><h3>Ajustes</h3>
    <div class="row">Voz do Tico lendo<button class="toggle" id="tv" aria-pressed="${DB.voz}" aria-label="Voz"></button></div>
    <div class="row">Sons de acerto<button class="toggle" id="ts" aria-pressed="${DB.som}" aria-label="Sons"></button></div>
    <div class="row wrap"><button class="linkbtn" id="troca2">Trocar de criança</button><button class="linkbtn" id="pais">Área dos pais</button>${COM_PORTAL ? '<a class="linkbtn" href="../">Todas as matérias</a>' : ''}</div>
  </section>`;
  $app.innerHTML = h;
  if (novasLote || D.loteVisto < LOTE_MAX) { D.loteVisto = LOTE_MAX; gravar(); }
  $app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { audio(); SFX.tap(); const id = b.dataset.l; id === 'simulado' ? iniciarSimulado() : iniciarLicao(LICOES.find(l => l.id === id)); });
  document.getElementById('treino').onclick = () => { audio(); SFX.tap(); iniciarTreino(); };
  if (nPend) document.getElementById('rev').onclick = () => { audio(); SFX.tap(); iniciarRevisao(); };
  if (CARTOES.length) document.getElementById('cart').onclick = () => { audio(); SFX.tap(); iniciarCartoes(); };
  if (M.resumo) document.getElementById('res').onclick = () => { SFX.tap(); renderResumo(); };
  document.getElementById('tv').onclick = e => { DB.voz = !DB.voz; gravar(); e.currentTarget.setAttribute('aria-pressed', DB.voz); if (DB.voz) say('Voz ligada!'); else hush(); };
  document.getElementById('ts').onclick = e => { DB.som = !DB.som; gravar(); e.currentTarget.setAttribute('aria-pressed', DB.som); SFX.tap(); };
  document.getElementById('troca').onclick = document.getElementById('troca2').onclick = () => { SFX.tap(); trocarCrianca(); };
  document.getElementById('pais').onclick = () => { SFX.tap(); renderPortaoPais(); };
}

/* ---------- montar rodadas ---------- */
const cartaoIntro = (title, body, memo, sayTxt) => ex({ title, body: `<p>${body}</p>`, memo, say: sayTxt || strip(title + '. ' + body) });
function novaRodada(tipo, licao, fila) { R = { tipo, licao, fila, pos: 0, contadas: new Set(), errouNaRodada: new Set(), acertos: 0, xp: 0, combo: 0, respostas: [], ultimo: Date.now(), metaAntes: pontosHoje(P.id) >= META_DIA }; renderPasso(); }
function iniciarLicao(l) {
  const n = l.rodada || M.rodada, total = l.todas.length, fila = [];
  l.blocos.forEach(b => {
    const quota = Math.max(Math.min(2, b.perguntas.length), Math.round(n * b.perguntas.length / total));
    fila.push(b.explica, ...shuffle(escolher(b.perguntas, quota)));
  });
  novaRodada('licao', l, fila);
}
function iniciarTreino() {
  const iniciadas = LICOES.filter(l => D.licoes[l.id]);
  const base = (iniciadas.length ? iniciadas : LICOES.slice(0, 1)).flatMap(l => l.todas);
  const porIdade = arr => arr.slice().sort((a, b) => ((st(a) || {}).u || 0) - ((st(b) || {}).u || 0));
  const fila = unico([
    ...shuffle(pendentes()).slice(0, 4),
    ...porIdade(base.filter(q => vista(q) && !pendente(q) && !dominada(q))).slice(0, 3),
    ...porIdade(base.filter(dominada)).slice(0, 2),
    ...shuffle(base.filter(q => !vista(q))),
    ...shuffle(base),
  ]).slice(0, 10);
  novaRodada('treino', { id: 'treino', titulo: 'Treino do dia', mod: { nome: 'Treino', c: CORES.roxo } },
    [cartaoIntro('Treino do dia!', 'Um pouquinho de cada coisa: perguntas que você errou, algumas para não esquecer e outras novas.', 'Treinar <b>um pouco todo dia</b> faz a memória ficar forte!'), ...shuffle(fila)]);
}
function iniciarRevisao() {
  const fila = pendentes().sort((a, b) => st(a).u - st(b).u).slice(0, 12);
  novaRodada('revisao', { id: 'revisao', titulo: 'Revisar erros', mod: { nome: 'Revisão', c: ['var(--oops)', 'var(--oops-d)', 'var(--oops-l)'] } },
    [cartaoIntro('Hora de revisar!', 'Aqui estão as perguntas que você errou antes. Cada uma que você acertar agora sai da lista.', 'Quem revisa os erros <b>memoriza de verdade</b>. Bora!'), ...shuffle(fila)]);
}
function iniciarSimulado() {
  const n = M.simulado.quantas;
  const out = shuffle(M.simulado.extras).slice(0, Math.ceil(n / 3));
  const porLicao = LICOES.map(l => shuffle(l.todas)); let i = 0;
  while (out.length < n && porLicao.some(a => a.length)) { const a = porLicao[i % porLicao.length]; if (a.length) out.push(a.pop()); i++; }
  novaRodada('simulado', SIM, [cartaoIntro('Hora do simulado!', `Agora é igual à prova: ${n} perguntas de tudo misturado. O Tico só mostra o resultado no final, com a sua nota.`, 'Leia com calma, pense na regra e responda. <b>Você consegue!</b>'), ...shuffle(out)]);
}

/* ---------- casca da lição ---------- */
function shell(inner, bottom) {
  const c = (R.licao.mod && R.licao.mod.c) || CORES.azul;
  $app.innerHTML = `<div class="lesson" style="${varsCor(c)}">
    <div class="lbar"><button class="x" id="quit" aria-label="Sair">${ICON.x}</button><div class="prog" role="progressbar" aria-valuenow="${R.pos}" aria-valuemax="${R.fila.length}"><i style="width:${Math.max(4, R.pos / R.fila.length * 100)}%"></i></div><div class="combo">${R.combo >= 2 ? `<span class="cmb">${ICON.fire}${R.combo}</span>` : ''}</div></div>
    ${inner}</div><div class="bottom" id="bottom"><div class="inner">${bottom}</div></div>`;
  document.getElementById('quit').onclick = () => { hush(); gravar(); renderMapa(); };
  window.scrollTo(0, 0);
}
function renderPasso() { const s = R.fila[R.pos]; if (!s) return renderFim(); s.t === 'explain' ? renderExplica(s) : renderPergunta(s); }

function renderExplica(s) {
  const l = R.licao, body = comTabelas(s.body);
  const list = s.list ? `<ul class="ex-list">${s.list.map(r => r[1] === '' && !r[2] ? `<li class="ex-sep">${r[0]}</li>` : `<li><span>${r[0]}</span>${r[1] ? `<span class="arrow">→</span><span>${r[1]}</span>` : ''}${r[2] ? `<small>${r[2]}</small>` : ''}</li>`).join('')}</ul>` : '';
  shell(`<article class="card slide">
      <span class="kicker" style="background:var(--mc)">${l.mod && l.mod.nome ? l.mod.nome + ' · ' : ''}Aprenda</span>
      <h2 class="ex-title">${s.title}</h2>${s.formula ? `<div class="formula">${s.formula}</div>` : ''}
      <div class="ex-body">${body}</div>${list}
      ${s.memo ? `<div class="tip">${tico('happy', 64)}<div class="bubble"><b>Dica do Tico:</b> ${s.memo}</div></div>` : ''}
    </article><button class="btn ghost small" id="again" style="max-width:260px;margin:0 auto">Ouvir de novo</button>`,
    `<button class="btn" id="next">Entendi! Vamos lá</button>`);
  const fala = s.say || strip(s.title + '. ' + body);
  document.getElementById('again').onclick = () => say(fala, true);
  document.getElementById('next').onclick = () => { SFX.tap(); R.pos++; renderPasso(); };
  sayDepois(fala, 250);
}

/* ---------- pergunta ---------- */
const norm = s => String(s).toLowerCase().replace(/[.!?;]+$/, '').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function renderPergunta(s) {
  const l = s.licao, sim = R.tipo === 'simulado';
  const label = R.tipo === 'revisao' ? 'Revisão' : R.tipo === 'treino' ? 'Treino · ' + (l.mod ? l.mod.nome : '') : sim ? 'Simulado' : (l.mod && l.mod.nome) || '';
  let area = '';
  if (s.t === 'mc' || s.t === 'table') {
    const opts = s.o.map((t, i) => ({ t, ok: i === s.a }));
    R.opts = s.keep ? opts : shuffle(opts);
    const two = s.two || (R.opts.length === 2 && R.opts.every(o => o.t.length < 22));
    area = (s.t === 'table' ? `<div class="mtx-wrap" style="margin-bottom:14px">${tabelaHTML(s.tab, s.cell)}</div>` : '') +
      `<div class="opts ${two ? 'two' : ''}">${R.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
  } else if (s.t === 'tap') {
    area = `<div class="toks">${s.s.map((w, i) => `<button class="tok" data-i="${i}">${esc(w)}</button>`).join('')}</div>`;
  } else if (s.t === 'match') {
    const L = shuffle(s.pairs.map((p, i) => ({ t: p[0], i }))), Rr = shuffle(s.pairs.map((p, i) => ({ t: p[1], i })));
    area = `<div class="match"><div class="col">${L.map(o => `<button class="mt" data-side="L" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div><div class="col">${Rr.map(o => `<button class="mt" data-side="R" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div></div>`;
  } else if (s.t === 'write') {
    area = `<input class="write-in" id="wr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escreva aqui" aria-label="Sua resposta">${s.dica ? `<p class="dica">${s.dica}</p>` : ''}`;
  }
  shell(`<article class="card slide">
      <div class="qhead"><span class="qlabel">${label}</span><button class="spk" id="spk" aria-label="Ouvir a pergunta">${ICON.spk}</button></div>
      <h2 class="prompt">${s.q}</h2>${area}</article>`,
    s.t === 'match' ? `<div class="hint-b">Toque em uma palavra de cada lado</div>` : `<button class="btn" id="check" disabled>${sim ? 'Responder' : 'Verificar'}</button>`);
  document.getElementById('spk').onclick = () => say(strip(s.q), true);
  sayDepois(strip(s.q), 200);
  const check = document.getElementById('check');

  if (s.t === 'mc' || s.t === 'table') {
    let sel = null;
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => { SFX.tap(); $app.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = +b.dataset.i; check.disabled = false; });
    check.onclick = () => {
      const ok = R.opts[sel].ok, certa = R.opts.find(o => o.ok).t;
      $app.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (sim) { if (i === sel) b.classList.add('sel'); } else if (R.opts[i].ok) b.classList.add('right'); else if (i === sel) b.classList.add('wrong'); });
      responder(s, ok, { certa, dada: R.opts[sel].t });
    };
  } else if (s.t === 'tap') {
    const chosen = new Set();
    $app.querySelectorAll('.tok').forEach(b => b.onclick = () => { SFX.tap(); const i = +b.dataset.i; chosen.has(i) ? chosen.delete(i) : chosen.add(i); b.classList.toggle('sel'); check.disabled = chosen.size === 0; });
    check.onclick = () => {
      const want = new Set(s.a), ok = want.size === chosen.size && [...want].every(i => chosen.has(i));
      $app.querySelectorAll('.tok').forEach(b => { const i = +b.dataset.i; b.disabled = true; if (sim) return; b.classList.remove('sel'); if (want.has(i) && chosen.has(i)) b.classList.add('right'); else if (want.has(i)) b.classList.add('miss'); else if (chosen.has(i)) b.classList.add('wrong'); });
      const lim = w => w.replace(/[.,!?]/g, '');
      responder(s, ok, { certa: s.a.map(i => lim(s.s[i])).join(', '), dada: [...chosen].sort((a, b) => a - b).map(i => lim(s.s[i])).join(', ') });
    };
  } else if (s.t === 'match') {
    let pickL = null, pickR = null, matched = 0, misses = 0;
    const tryPair = () => {
      if (!pickL || !pickR) return;
      if (pickL.dataset.i === pickR.dataset.i) {
        [pickL, pickR].forEach(b => { b.classList.remove('sel'); b.classList.add(sim ? 'neutro' : 'done'); b.disabled = true; }); matched++; if (!sim) { tone(880, 0, .12); tone(1175, .07, .16); } else SFX.tap();
        if (matched === s.pairs.length) setTimeout(() => responder(s, true, { certa: s.pairs.map(p => p.join(' e ')).join('; '), dada: misses ? misses + ' erro(s) no caminho' : 'todos certos', misses }), 250);
      } else { misses++; const a = pickL, b = pickR; if (sim) { SFX.tap(); [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('neutro'); x.disabled = true; }); matched++; if (matched === s.pairs.length) setTimeout(() => responder(s, true, { certa: s.pairs.map(p => p.join(' e ')).join('; '), dada: misses + ' par(es) errado(s)', misses }), 250); } else { SFX.oops(); [a, b].forEach(x => x.classList.add('shake')); setTimeout(() => [a, b].forEach(x => x.classList.remove('shake', 'sel')), 380); } }
      pickL = pickR = null;
    };
    $app.querySelectorAll('.mt').forEach(b => b.onclick = () => {
      if (b.classList.contains('done')) return; SFX.tap();
      if (b.dataset.side === 'L') { if (pickL) pickL.classList.remove('sel'); pickL = b; } else { if (pickR) pickR.classList.remove('sel'); pickR = b; }
      b.classList.add('sel'); tryPair();
    });
  } else if (s.t === 'write') {
    const inp = document.getElementById('wr');
    inp.oninput = () => { check.disabled = !inp.value.trim(); };
    const go = () => {
      if (!inp.value.trim()) return;
      const dada = inp.value.trim(), n = norm(dada);
      const exata = s.r.some(r => norm(r) === n), quase = !exata && s.r.some(r => semAcento(norm(r)) === semAcento(n));
      inp.disabled = true; check.disabled = true;
      const ok = exata || (quase && !sim); // no simulado, faltar acento conta como erro, igual à prova
      if (!sim) inp.classList.add(ok ? 'right' : 'wrong');
      responder(s, ok, { certa: s.r[0], dada, acento: quase && !sim });
    };
    check.onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    setTimeout(() => inp.focus(), 300);
  }
}

/* ---------- resposta ---------- */
function responder(s, ok, info) {
  const agora = Date.now(); D.tempo += Math.min(agora - R.ultimo, 120000); R.ultimo = agora;
  const primeira = !R.contadas.has(s.id);
  const okStat = ok && !info.misses; // ligou tudo, mas errou par no caminho: comemora, mas fica para reforçar
  if (primeira) { registrar(s, okStat); R.contadas.add(s.id); }
  if (R.tipo === 'simulado') {
    R.respostas.push({ q: s, ok: okStat, ...info }); if (okStat) R.acertos++;
    gravar(); SFX.tap();
    const b = document.getElementById('bottom');
    b.innerHTML = `<div class="inner"><div class="hint-b">Resposta registrada</div><button class="btn" id="cont">Próxima</button></div>`;
    const c = document.getElementById('cont'); c.focus({ preventScroll: true }); c.onclick = () => { SFX.tap(); R.pos++; renderPasso(); };
    return;
  }
  const retry = R.errouNaRodada.has(s.id);
  let xp = 0, extra = '';
  if (ok) {
    R.acertos++; R.combo++; D.melhorCombo = Math.max(D.melhorCombo, R.combo);
    xp = retry ? 5 : (info.misses ? 6 : 10);
    if (R.combo % 5 === 0) xp += 5;
    if (COMBO_MSG[R.combo]) extra = COMBO_MSG[R.combo];
    if (R.tipo === 'revisao' && st(s)) st(s).ul = 1;
    R.xp += xp; D.xp += xp; D.dias[hoje()] = (D.dias[hoje()] || 0) + xp;
    (COMBO_MSG[R.combo] ? SFX.combo : SFX.ok)(); confetti(COMBO_MSG[R.combo] ? 120 : 45);
  } else {
    R.combo = 0; R.errouNaRodada.add(s.id); R.fila.push(s); SFX.oops();
  }
  gravar();
  const title = ok ? pick(PRAISE)() : pick(OOPS)();
  const nota = ok && info.acento ? `<br><b>Cuidado com o acento:</b> o certo é <b>${esc(info.certa)}</b>.` : ok && info.misses ? '<br>Na próxima, tente ligar todos sem errar nenhum.' : '';
  const b = document.getElementById('bottom');
  b.className = 'bottom slide ' + (ok ? 'good' : 'bad');
  b.innerHTML = `<div class="inner"><div class="fb">${tico(ok ? 'cheer' : 'oops', 70, ok ? 'pop' : '')}<div style="min-width:0">
      <h3>${title}</h3>
      ${ok ? `<p><span class="xpfly">+${xp} pontos</span>${extra ? ` · <b style="color:var(--oops-d)">${extra}</b>` : ''}</p>` : `<p>Resposta certa: <b>${esc(info.certa)}</b></p>`}
      <p class="why">${s.why || ''}${nota}${ok ? '' : '<br><b>' + pick(OOPS_SUB) + '</b>'}</p></div></div>
    <button class="btn ${ok ? 'ok' : 'oops'}" id="cont">${ok ? 'Continuar' : 'Entendi'}</button></div>`;
  const c = document.getElementById('cont'); c.focus({ preventScroll: true });
  c.onclick = () => { SFX.tap(); R.pos++; renderPasso(); };
  say(ok ? strip(title) + (extra ? '. ' + extra : '') : strip(title) + ' A resposta certa é: ' + info.certa + '. ' + strip(s.why || ''));
}

/* ---------- fim da rodada ---------- */
function renderFim() {
  hush();
  const unicas = [...R.contadas].length, errs = R.errouNaRodada.size;
  const sim = R.tipo === 'simulado';
  let stars, titulo, msg, extraHTML = '';
  if (sim) {
    const nota = R.respostas.length ? R.acertos / R.respostas.length * 10 : 0;
    stars = nota >= 9 ? 3 : nota >= 7 ? 2 : 1;
    D.simulados.push({ data: hoje(), nota: Math.round(nota * 10) / 10, n: R.respostas.length });
    const ganho = R.acertos * 10; R.xp = ganho; D.xp += ganho; D.dias[hoje()] = (D.dias[hoje()] || 0) + ganho;
    titulo = 'Nota ' + nota.toFixed(1).replace('.', ',');
    msg = nota >= 9 ? `Excelente, ${N()}! Você mandou muito bem: dá para ir para a prova com confiança!` : nota >= 7 ? 'Muito bom! Revise os erros abaixo e você chega no 10.' : 'Bom treino! Os erros já foram para a revisão. Revise e tente de novo.';
    const errs2 = R.respostas.filter(r => !r.ok);
    extraHTML = errs2.length ? `<div class="card erros"><h3>Para revisar (${errs2.length})</h3>${errs2.map(r => `<div class="err"><p class="eq">${r.q.q}</p><p><span class="tag bad">Sua resposta</span> ${esc(r.dada || '')}</p><p><span class="tag good">Certa</span> <b>${esc(r.certa)}</b></p><p class="why">${r.q.why || ''}</p></div>`).join('')}</div>` : '';
  } else {
    stars = errs === 0 ? 3 : errs <= 2 ? 2 : 1;
    titulo = R.tipo === 'revisao' ? 'Revisão feita!' : R.tipo === 'treino' ? 'Treino completo!' : 'Lição completa!';
    const faltam = pendentes().length;
    msg = R.tipo === 'revisao' ? (faltam ? `Ainda faltam ${faltam} para revisar. Você está quase lá!` : 'Lista de erros zerada! Você aprendeu tudo.')
      : stars === 3 ? `Sem errar nenhuma! ${N()}, você é demais!` : stars === 2 ? 'Muito bom! Quase perfeito. Mais uma rodada e vira 3 estrelas.' : 'Você terminou! Cada erro virou aprendizado. Que tal mais uma rodada?';
    if (R.tipo === 'licao') { const l = R.licao, nv = novasDe(l); extraHTML = `<div class="bubble small">${dominadasDe(l)} de ${l.todas.length} perguntas dominadas nesta lição.${nv ? ` Ainda tem ${nv} pergunta${nv > 1 ? 's' : ''} que você nunca viu: jogue de novo!` : ''}</div>`; }
  }
  if (R.tipo === 'licao' || sim) { const id = R.licao.id, prev = D.licoes[id] || {}; D.licoes[id] = { estrelas: Math.max(stars, prev.estrelas || 0), rodadas: (prev.rodadas || 0) + 1 }; }
  const bateuMeta = !R.metaAntes && pontosHoje(P.id) >= META_DIA;
  gravar();
  const unicasTxt = sim ? `${R.acertos}/${R.respostas.length}` : (unicas ? Math.round((unicas - errs) / unicas * 100) : 100) + '%';
  const idx = LICOES.indexOf(R.licao), next = R.tipo === 'licao' && idx >= 0 ? LICOES[idx + 1] : null;
  $app.innerHTML = `<div class="end">
    ${tico('cheer', 120, 'bounce')}
    <h1>${titulo}</h1>
    ${R.tipo === 'licao' || sim ? `<div class="bigstars">${STAR(stars >= 1)}${STAR(stars >= 2)}${STAR(stars >= 3)}</div>` : ''}
    ${bateuMeta ? `<div class="aviso novo meta-ok">${ICON.fire.replace('<svg', '<svg width="40" height="40"')}<div><b>Meta do dia cumprida!</b><br>${ofensiva(P.id)} dia${ofensiva(P.id) > 1 ? 's' : ''} seguido${ofensiva(P.id) > 1 ? 's' : ''} estudando.</div></div>` : ''}
    <div class="bubble" style="max-width:420px">${msg}</div>
    <div class="stats"><div class="stat"><b>+${R.xp}</b><span>pontos</span></div><div class="stat"><b>${unicasTxt}</b><span>${sim ? 'acertos' : 'de primeira'}</span></div><div class="stat"><b>${D.melhorCombo}</b><span>recorde seguidas</span></div></div>
    ${extraHTML}
    ${next ? `<button class="btn ok" id="nx">Próxima: ${next.titulo}</button>` : ''}
    ${R.tipo === 'licao' ? `<button class="btn ghost" id="rep">Jogar esta lição de novo</button>` : ''}
    ${sim ? `<button class="btn ghost" id="rep">Fazer outro simulado</button>` : ''}
    <button class="btn ghost" id="map">Voltar ao mapa</button>
  </div>`;
  SFX.win(); confetti(160); setTimeout(() => confetti(120), 500);
  say(strip(titulo) + '. ' + strip(msg) + (bateuMeta ? ' E você cumpriu a meta do dia!' : ''));
  const lic = R.licao;
  const nx = document.getElementById('nx'); if (nx) nx.onclick = () => iniciarLicao(next);
  const rp = document.getElementById('rep'); if (rp) rp.onclick = () => sim ? iniciarSimulado() : iniciarLicao(lic);
  document.getElementById('map').onclick = renderMapa;
}

/* ---------- cartões das regras (para decorar) ---------- */
function iniciarCartoes() {
  const fila = [...CARTOES.filter(c => D.cartoes[c.k] !== 'sei'), ...CARTOES.filter(c => D.cartoes[c.k] === 'sei')];
  let i = 0, virado = false, sabidos = 0;
  const tela = () => {
    const c = fila[i];
    if (!c) {
      gravar(); SFX.win(); confetti(120);
      $app.innerHTML = `<div class="end">${tico('cheer', 120, 'bounce')}<h1>Cartões revisados!</h1><div class="bubble">Você marcou ${sabidos} como "já sei". Os que você pediu para rever aparecem primeiro na próxima vez.</div><button class="btn" id="map">Voltar ao mapa</button></div>`;
      say('Cartões revisados! Muito bem.'); document.getElementById('map').onclick = renderMapa; return;
    }
    const cor = c.licao.mod.c;
    $app.innerHTML = `<div class="lesson" style="${varsCor(cor)}">
      <div class="lbar"><button class="x" id="quit" aria-label="Sair">${ICON.x}</button><div class="prog"><i style="width:${Math.max(4, i / fila.length * 100)}%"></i></div><div class="combo">${i + 1}/${fila.length}</div></div>
      <button class="flash ${virado ? 'virado' : ''}" id="flip" aria-label="Virar o cartão">
        <span class="kicker" style="background:var(--mc)">${esc(c.licao.mod.nome)} · ${esc(c.licao.titulo)}</span>
        <span class="f-frente">${c.frente}</span>
        ${virado ? `<span class="f-verso">${c.verso}</span>` : '<span class="f-hint">Toque para ver a resposta</span>'}
      </button></div>
      <div class="bottom"><div class="inner">${virado ? '<div class="two-btn"><button class="btn oops" id="rever">Rever de novo</button><button class="btn ok" id="sei">Já sei!</button></div>' : '<button class="btn" id="virar">Virar o cartão</button>'}</div></div>`;
    document.getElementById('quit').onclick = () => { hush(); gravar(); renderMapa(); };
    const virar = () => { if (virado) return; virado = true; SFX.flip(); tela(); say(strip(c.verso)); };
    document.getElementById('flip').onclick = virar;
    const vb = document.getElementById('virar'); if (vb) vb.onclick = virar;
    if (virado) {
      document.getElementById('sei').onclick = () => { D.cartoes[c.k] = 'sei'; sabidos++; SFX.ok(); i++; virado = false; gravar(); tela(); setTimeout(() => fila[i] && say(strip(fila[i].frente)), 200); };
      document.getElementById('rever').onclick = () => { D.cartoes[c.k] = 'rever'; fila.push(c); SFX.tap(); i++; virado = false; gravar(); tela(); setTimeout(() => fila[i] && say(strip(fila[i].frente)), 200); };
    }
  };
  tela(); say('Cartões das regras. ' + strip(fila[0].frente));
}

/* ---------- resumão ---------- */
function renderResumo() {
  window.scrollTo(0, 0);
  $app.innerHTML = `<div class="lesson res">
    <div class="lbar"><button class="x" id="back" aria-label="Voltar">${ICON.back}</button><h2 style="font-size:24px">Resumão das regras</h2></div>
    ${M.resumo.map(r => { const c = CORES[r.cor] || CORES.azul; return `<div class="card" style="${varsCor(c)}"><span class="kicker" style="background:var(--mc)">${r.titulo}</span><h3>${r.subtitulo || ''}</h3><ul>${r.itens.map(i => `<li>${i}</li>`).join('')}</ul>${r.tabelas ? `<div style="margin-top:10px">${comTabelas('[[tabelas:' + r.tabelas.join(',') + ']]')}</div>` : ''}</div>`; }).join('')}
    <button class="btn" id="back2">Voltar ao mapa</button></div>`;
  document.getElementById('back').onclick = renderMapa; document.getElementById('back2').onclick = renderMapa;
  say('Resumão das regras. Tudo numa página só.');
}

/* ---------- área dos pais ---------- */
function renderPortaoPais() {
  hush(); window.scrollTo(0, 0);
  const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
  $app.innerHTML = `<div class="start"><div class="lbar" style="width:100%"><button class="x" id="back" aria-label="Voltar">${ICON.back}</button></div>
    <h1 style="font-size:30px">Área dos pais</h1><div class="bubble">Para entrar, responda: quanto é <b>${a} × ${b}</b>?</div>
    <input class="name-in" id="pg" inputmode="numeric" autocomplete="off" aria-label="Resposta"><button class="btn" id="ok" style="max-width:340px">Entrar</button></div>`;
  document.getElementById('back').onclick = renderMapa;
  const tenta = () => { if (+document.getElementById('pg').value === a * b) renderPais(); else { const i = document.getElementById('pg'); i.classList.add('shake'); setTimeout(() => i.classList.remove('shake'), 400); i.value = ''; } };
  document.getElementById('ok').onclick = tenta; document.getElementById('pg').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); tenta(); } };
}
function minutos(ms) { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + pad2(m % 60); }
function renderPais() {
  window.scrollTo(0, 0);
  const vistas = TODAS.filter(vista).length, naoVistas = TODAS.length - vistas;
  const porLote = {}; TODAS.forEach(q => { porLote[q.lote || 1] = (porLote[q.lote || 1] || 0) + 1; });
  const blocos = DB.perfis.map(p => {
    const d = dadosDe(p.id, M.slug);
    const est = Object.entries(d.q).filter(([id]) => Q[id]);
    const resp = est.reduce((a, [, s]) => a + s.v, 0), certas = est.reduce((a, [, s]) => a + s.c, 0);
    const piores = est.filter(([, s]) => s.e > 0).sort((a, b) => b[1].e - a[1].e || a[1].s - b[1].s).slice(0, 6);
    const dom = TODAS.filter(q => { const s = d.q[q.id]; return s && (s.s >= 2 || (s.s >= 1 && s.e === 0)); }).length;
    const sims = d.simulados.slice(-5);
    return `<div class="card pais">
      <div class="pais-h">${avatar(p, 48)}<div><h3>${esc(p.nome)}</h3><small>${ofensiva(p.id)} dia(s) seguido(s) · ${d.xp} pontos · ${minutos(d.tempo)} de estudo</small></div></div>
      <div class="stats"><div class="stat"><b>${resp}</b><span>respostas</span></div><div class="stat"><b>${resp ? Math.round(certas / resp * 100) : 0}%</b><span>acertos</span></div><div class="stat"><b>${dom}/${TODAS.length}</b><span>dominadas</span></div></div>
      <table class="tb"><tr><th>Lição</th><th>Estrelas</th><th>Dominadas</th><th>Nunca viu</th></tr>
      ${LICOES.map(l => { const dl = d.licoes[l.id] || {}; const domL = l.todas.filter(q => { const s = d.q[q.id]; return s && (s.s >= 2 || (s.s >= 1 && s.e === 0)); }).length; const nv = l.todas.filter(q => !d.q[q.id]).length; return `<tr><td>${l.titulo}</td><td>${dl.estrelas || '-'}</td><td>${domL}/${l.todas.length}</td><td>${nv}</td></tr>`; }).join('')}</table>
      ${sims.length ? `<p><b>Simulados:</b> ${sims.map(s => s.data.split('-').reverse().slice(0, 2).join('/') + ' nota ' + String(s.nota).replace('.', ',')).join(' · ')}</p>` : ''}
      ${piores.length ? `<p><b>Mais erradas:</b></p><ol class="piores">${piores.map(([id, s]) => `<li>${strip(Q[id].q)} <small>(errou ${s.e}x)</small></li>`).join('')}</ol>` : '<p>Ainda sem erros registrados.</p>'}
      <div class="row wrap"><button class="linkbtn" data-ren="${p.id}">Renomear</button><button class="linkbtn danger" data-zera="${p.id}">Zerar ${esc(M.titulo)}</button><button class="linkbtn danger" data-apaga="${p.id}">Apagar criança</button></div></div>`;
  }).join('');
  $app.innerHTML = `<div class="lesson res">
    <div class="lbar"><button class="x" id="back" aria-label="Voltar">${ICON.back}</button><h2 style="font-size:24px">Área dos pais</h2></div>
    <div class="card"><h3>Banco de perguntas: ${esc(M.titulo)} ${esc(M.serie || '')}</h3>
      <p>${TODAS.length} perguntas em ${LICOES.length} lições (${Object.entries(porLote).map(([n, q]) => `lote ${n}: ${q}`).join(', ')}).</p>
      <p>${N()} já viu <b>${vistas}</b> e ainda não viu <b>${naoVistas}</b>.${naoVistas < M.rodada * 3 ? ' <b style="color:var(--oops-d)">Está na hora de pedir um lote novo.</b>' : ''}</p>
      <p class="why">Para renovar: peça ao Claude "renova o quiz de ${esc(M.titulo)}". As perguntas novas entram no mesmo link e o progresso continua.</p></div>
    ${blocos}
    <div class="card"><h3>Backup do progresso</h3>
      <p class="why">O progresso fica só neste aparelho. O Safari pode apagá-lo se o site ficar uns 7 dias sem uso. De vez em quando, copie o código de backup e guarde (por exemplo, mandando para você mesmo no WhatsApp). Para trazer de volta, toque em Restaurar e cole o código.</p>
      <div class="row wrap"><button class="linkbtn" id="bk">Copiar backup</button><button class="linkbtn" id="rs">Restaurar backup</button></div><p class="why" id="bkmsg"></p></div>
    <button class="btn" id="back2">Voltar ao mapa</button></div>`;
  document.getElementById('back').onclick = renderMapa; document.getElementById('back2').onclick = renderMapa;
  const msg = txt => { document.getElementById('bkmsg').textContent = txt; };
  document.getElementById('bk').onclick = () => {
    const c = codigoBackup();
    const manual = () => { prompt('Copie o código abaixo e guarde:', c); };
    try { navigator.clipboard.writeText(c).then(() => msg('Código copiado! Cole e guarde em um lugar seguro.'), manual); } catch (e) { manual(); }
  };
  document.getElementById('rs').onclick = () => {
    const c = prompt('Cole aqui o código de backup:'); if (!c) return;
    try { restaurarBackup(c); location.reload(); } catch (e) { msg('Esse código não é um backup válido. Confira se copiou inteiro.'); }
  };
  const confirma = (b, txt, acao) => { if (b.dataset.armed) return acao(); b.dataset.armed = 1; const t = b.textContent; b.textContent = txt; setTimeout(() => { delete b.dataset.armed; b.textContent = t; }, 3500); };
  $app.querySelectorAll('[data-ren]').forEach(b => b.onclick = () => { const p = DB.perfis.find(x => x.id === b.dataset.ren); const n = prompt('Novo nome:', p.nome); if (n && n.trim()) { p.nome = n.trim().slice(0, 20); gravar(); renderPais(); } });
  $app.querySelectorAll('[data-zera]').forEach(b => b.onclick = () => confirma(b, 'Tem certeza? Toque de novo', () => { delete DB.dados[b.dataset.zera][M.slug]; if (b.dataset.zera === P.id) D = dadosDe(P.id, M.slug); gravar(); renderPais(); }));
  $app.querySelectorAll('[data-apaga]').forEach(b => b.onclick = () => confirma(b, 'Apagar mesmo? Toque de novo', () => { apagarPerfil(b.dataset.apaga); const p = perfilAtivo(); if (!p) return telaPerfis($app, entrar); if (p.id !== P.id) entrar(p); else renderPais(); }));
}

/* ---------- início ---------- */
migrarLegado();
(() => { const p = perfilAtivo(); p ? entrar(p) : telaPerfis($app, entrar); })();
// usado nos testes automáticos (abre uma rodada só com as perguntas pedidas)
window.__estudos = { M, Q, LICOES, get D() { return D; }, get R() { return R; }, rodada: ids => novaRodada('treino', { id: 'teste', titulo: 'Teste', mod: { nome: 'Teste', c: CORES.roxo } }, ids.map(id => Q[id])) };

</script>
