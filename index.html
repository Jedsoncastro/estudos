<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF3FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudos">
<title>Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: uma coluna de celular (max 560px). Mapa em trilha; rodada = barra de progresso no topo, cartão no meio, botão grande embaixo.
   Cada módulo define sua cor em --mc / --mc-d / --mc-l. Tema claro fixo de propósito (jogo infantil). */
:root{
  --bg:#EEF3FB; --card:#FFFFFF; --ink:#1D2340; --muted:#5D6487; --line:#D6DDEC;
  --blue:#2D5BD0; --blue-d:#1F44A6; --blue-l:#E3EBFD;
  --green:#14755B; --green-d:#0C5643; --green-l:#DDF2EA;
  --amber:#E7A21B; --amber-d:#A96F00; --amber-l:#FFF2D3;
  --purple:#7A4FD0; --purple-d:#5A33A8; --purple-l:#EEE7FC;
  --pink:#C4407A; --pink-d:#9A2C5D; --pink-l:#FBE4EE;
  --cyan:#0F8BA8; --cyan-d:#0A6880; --cyan-l:#DDF3F8;
  --ok:#2FA968; --ok-d:#1F8450; --ok-l:#DDF6E7;
  --oops:#E8723C; --oops-d:#BD5323; --oops-l:#FFE8DC;
  --gold:#F5B800; --rust:#C4572A;
  --mc:var(--blue); --mc-d:var(--blue-d); --mc-l:var(--blue-l);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:140px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);transition:transform .08s, box-shadow .08s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn[disabled]{background:var(--line);color:#8E96B3;box-shadow:0 5px 0 #C3CBDD;cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.oops{background:var(--oops);box-shadow:0 5px 0 var(--oops-d)}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost[disabled]{color:#9AA2BE;background:var(--card)}
.btn.small{font-size:16px;padding:10px 14px}

/* ---------- mascote e avatares ---------- */
.tico{display:block;flex:none}
.bounce{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.ava{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--f-display);font-weight:800;flex:none;line-height:1}
.ava.ghost{background:var(--card);border:3px dashed var(--line);color:var(--muted)}

/* ---------- início / perfis ---------- */
.start{display:grid;gap:18px;padding-top:24px;text-align:center;justify-items:center}
.start h1{font-size:40px;color:var(--blue-d)}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-weight:700;max-width:420px}
.bubble::after{content:"";position:absolute;left:50%;top:-11px;width:18px;height:18px;background:var(--card);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.small{font-size:15px}
.bubble.small::after{display:none}
.name-in,.write-in{width:100%;max-width:340px;font:800 24px var(--f-display);text-align:center;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.name-in::placeholder,.write-in::placeholder{color:#9AA2BE}
.perfis{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.perfil{display:grid;justify-items:center;gap:6px;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);min-width:108px}
.perfil b{font-size:17px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- mapa ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 12px}
.chip-perfil{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.hello{font:800 24px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:900;font-variant-numeric:tabular-nums}
.pill svg{width:19px;height:19px}
.hero{margin-bottom:14px;padding:14px 16px}
.hero-t{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero-m{font:800 26px var(--f-display);color:var(--blue-d);line-height:1.1}
.hero-m span{font-size:18px;color:var(--muted)}
.prova{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:900;color:var(--oops-d);background:var(--oops-l);border-radius:999px;padding:3px 12px 3px 8px;font-size:15px}
.prova svg{width:18px;height:18px}
.meta{flex:1;min-width:180px}
.meta-l{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--muted);margin-bottom:4px}
.aviso{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:14px;font-size:15px;text-align:left}
.aviso.novo{border-color:var(--gold);background:#FFF8E0}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.acoes .btn{font-size:15px;padding:12px 8px}
.acoes #treino{grid-column:1/-1;font-size:19px;background:var(--purple);box-shadow:0 5px 0 var(--purple-d)}
.acoes>:nth-child(4){grid-column:1/-1}
.mod{margin-bottom:26px}
.mod-head{border-radius:20px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;background:var(--mc)}
.mod-head .num{font:800 34px var(--f-display);opacity:.9;line-height:1}
.mod-head h2{font-size:26px}
.mod-head p{margin:0;font-weight:700;opacity:.92;font-size:15px}
.trail{display:grid;gap:14px;padding:18px 0 0}
.node{display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%}
.node:nth-child(4n+2){margin-left:16%}
.node:nth-child(4n+3){margin-left:30%}
.node:nth-child(4n+4){margin-left:16%}
.dot{flex:none;width:76px;height:76px;border-radius:50%;padding:5px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.dot-in{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:800 28px var(--f-display);color:#fff;border:3px solid #fff}
.node-label{min-width:0}
.node-label b{display:block;font-size:16px;line-height:1.2}
.node-label .sub{display:block;color:var(--muted);font-weight:800;font-size:13px;margin-top:2px}
.aqui{color:var(--oops-d);font-weight:900}
.stars{display:flex;gap:2px;margin-top:3px}
.stars svg{width:18px;height:18px}
.final .dot{width:88px;height:88px;background:var(--gold)}
.settings{margin-top:30px;background:var(--card);border-radius:18px;border:2px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.settings h3{font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.row.wrap{flex-wrap:wrap;justify-content:flex-start;gap:6px 18px}
.toggle{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{left:28px}
.linkbtn{color:var(--blue);font-weight:800;text-decoration:underline;padding:4px 0}
.linkbtn.danger{color:var(--oops-d)}

/* ---------- portal ---------- */
.materias{display:grid;gap:14px}
.materia{display:grid;gap:8px;background:var(--card);border:2px solid var(--line);border-left:10px solid var(--mc);border-radius:18px;padding:14px 16px;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--line)}
.mt-top{display:flex;align-items:baseline;gap:8px}
.mt-top h2{font-size:26px}
.mt-top span{font-weight:800;color:var(--muted)}
.mt-mods{display:flex;flex-wrap:wrap;gap:6px}
.mt-mods span{font-size:13px;font-weight:800;background:var(--bg);border-radius:999px;padding:2px 10px;color:var(--muted)}
.materia small{color:var(--muted);font-weight:700}

/* ---------- rodada ---------- */
.lesson{display:flex;flex-direction:column;gap:16px}
.lbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:5}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--muted)}
.x svg{width:24px;height:24px}
.prog{flex:1;height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.prog.small{height:12px}
.prog i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .4s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-weight:900;color:var(--oops-d);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.cmb{display:inline-flex;align-items:center;gap:2px}
.cmb svg{width:18px;height:18px}
.card{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:18px}
.kicker{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.ex-title{font-size:28px;margin-bottom:12px}
.formula{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font:800 22px var(--f-display);background:var(--bg);border-radius:16px;padding:12px;margin:6px 0 14px}
.formula .fx{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;white-space:nowrap}
.formula .s{color:var(--mc);border-color:var(--mc)}
.formula .op{color:var(--muted)}
.ex-body p{margin:0 0 10px}
.ex-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.ex-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:800;font-size:19px}
.ex-list li.ex-sep{background:none;padding:6px 0 0;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ex-list .arrow{color:var(--muted)}
.ex-list small{flex-basis:100%;font-weight:600;font-size:14px;color:var(--muted)}
mark{background:none;color:var(--mc-d);font-weight:900;text-decoration:underline 3px;text-underline-offset:3px}
.tip{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tip .bubble{flex:1;text-align:left;font-size:16px}
.tip .bubble::after{left:-11px;top:24px;transform:rotate(-45deg)}
.tip .bubble b{color:var(--rust)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twocol>div{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.twocol h4{margin:0 0 4px;font:800 15px var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.twocol .big{font:800 21px var(--f-display);line-height:1.2}
.twocol small{display:block;color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.mtx{border-collapse:separate;border-spacing:4px;margin:4px auto;font-variant-numeric:tabular-nums}
.mtx th{font-size:13px;color:var(--muted);font-weight:800;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.mtx td{background:var(--mc-l);border-radius:10px;font:800 26px var(--f-display);color:var(--mc-d);text-align:center;min-width:76px;padding:4px 8px}
.mtx td.q{background:var(--amber-l);color:var(--amber-d);outline:3px dashed var(--amber)}
.mtx caption{font:800 16px var(--f-display);color:var(--mc-d);padding-bottom:2px}
.mtx-wrap{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;overflow-x:auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.qlabel{font-weight:900;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.spk{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
.spk svg{width:24px;height:24px}
.prompt{font-size:25px;font-weight:700;margin-bottom:16px}
.prompt b{color:var(--mc-d)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-l);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--oops);background:var(--oops-l);box-shadow:0 4px 0 var(--oops)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center}
.toks{display:flex;flex-wrap:wrap;gap:8px;font-size:22px;line-height:1.2}
.tok{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--line)}
.tok.sel{border-color:var(--mc);background:var(--mc-l);box-shadow:0 3px 0 var(--mc)}
.tok.right{border-color:var(--ok);background:var(--ok-l)}
.tok.miss{border-color:var(--oops);border-style:dashed}
.tok.wrong{border-color:var(--oops);background:var(--oops-l)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;min-width:0}
.mt{padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--line);text-align:center}
.mt.sel{border-color:var(--amber);background:var(--amber-l);box-shadow:0 4px 0 var(--amber)}
.mt.neutro{border-color:var(--line);background:var(--bg);color:var(--muted);box-shadow:none}
.mt.done{border-color:var(--ok);background:var(--ok-l);color:var(--ok-d);box-shadow:none;opacity:.75}
.write-in{max-width:none;text-align:left;font-size:24px}
.write-in.right{border-color:var(--ok);background:var(--ok-l)}
.write-in.wrong{border-color:var(--oops);background:var(--oops-l)}
.dica{margin:8px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom .inner{max-width:560px;margin:0 auto;display:grid;gap:12px}
.bottom.good{background:var(--ok-l);border-color:var(--ok)}
.bottom.bad{background:var(--oops-l);border-color:var(--oops)}
.hint-b{text-align:center;font-weight:800;color:var(--muted)}
.fb{display:flex;gap:12px;align-items:center}
.fb h3{font-size:26px}
.good .fb h3{color:var(--ok-d)}
.bad .fb h3{color:var(--oops-d)}
.fb p{margin:2px 0 0;font-weight:700}
.fb .why{font-weight:600;font-size:15px;color:var(--ink)}
.slide{animation:slide .25s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.xpfly{font:800 20px var(--f-display);color:var(--amber-d)}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- cartões ---------- */
.flash{width:100%;display:grid;gap:14px;align-content:center;justify-items:center;text-align:center;min-height:300px;background:var(--card);border:3px solid var(--mc);border-radius:24px;padding:22px 18px;box-shadow:0 6px 0 var(--mc-d)}
.f-frente{font:800 28px var(--f-display);color:var(--mc-d);line-height:1.2}
.f-verso{font-weight:800;font-size:20px;background:var(--mc-l);border-radius:16px;padding:12px 14px;line-height:1.4}
.f-hint{color:var(--muted);font-weight:800}
.flash.virado{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}

/* ---------- fim ---------- */
.end{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:20px}
.end h1{font-size:36px;color:var(--ok-d)}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:58px;height:58px}
.bigstars svg.on{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{border-radius:16px;border:2px solid var(--line);background:var(--card);padding:10px 6px;text-align:center}
.stat b{display:block;font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.end .btn{max-width:420px}
.end .aviso{max-width:420px;width:100%}
.meta-ok svg{flex:none}
.erros{width:100%;text-align:left}
.erros h3{font-size:22px;margin-bottom:6px}
.err{border-top:2px solid var(--line);padding:10px 0}
.err p{margin:4px 0}
.err .eq{font-weight:800}
.err .why{color:var(--muted);font-size:15px;font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:1px 8px;margin-right:4px}
.tag.bad{background:var(--oops-l);color:var(--oops-d)}
.tag.good{background:var(--ok-l);color:var(--ok-d)}

/* ---------- resumão e pais ---------- */
.res{display:grid;gap:14px}
.res .card h3{font-size:22px;margin-bottom:8px}
.res ul{margin:0;padding-left:20px;display:grid;gap:6px}
.res li b{font-weight:900}
.pais{display:grid;gap:12px}
.pais-h{display:flex;gap:12px;align-items:center}
.pais-h small{color:var(--muted);font-weight:700}
.pais p{margin:0}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tb th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tb td:not(:first-child),.tb th:not(:first-child){text-align:center;font-variant-numeric:tabular-nums}
.piores{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.piores small{color:var(--muted)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.bounce,.pop,.slide,.shake,.bigstars svg.on,.flash.virado{animation:none}}
@media (max-width:380px){.prompt{font-size:22px}.ex-title{font-size:24px}.node:nth-child(4n+3){margin-left:22%}.hello{font-size:20px}.pill{padding:3px 7px}}

</style>
</head>
<body data-portal="1">
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
/* ===================== BASE (dividida entre o portal e as páginas de matéria) =====================
   Guarda: perfis das crianças, progresso por matéria, ajustes de voz/som, o mascote Tico,
   ícones, sons sintetizados, voz do navegador e confete. Tudo fica no próprio aparelho (localStorage). */

const KEY = 'estudos-v1';
const LEGADO = { 'missao-portugues-y5': 'portugues-year5' }; // quiz antigo -> matéria nova
const META_DIA = 50; // pontos por dia para cumprir a meta

const pad2 = n => String(n).padStart(2, '0');
const hoje = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stripBasico = h => String(h).replace(/<br\s*\/?>/g, '. ').replace(/<[^>]+>/g, '').replace(/___/g, ', espaço, ').replace(/→/g, ', vira, ').replace(/\s+/g, ' ').trim();
// com o conteúdo carregado, a fala usa a mesma limpeza da narração gravada (motor/ajudantes.js: limpaFala)
const strip = h => (typeof limpaFala === 'function' ? limpaFala(h) : stripBasico(h));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- armazenamento ---------- */
function vazio() { return { v: 1, perfis: [], ativo: null, voz: true, som: true, dados: {}, migrado: {} }; }
// reconstrói os dados campo a campo, só com o formato esperado (protege contra backup adulterado
// ou outro site do mesmo endereço mexendo no armazenamento: nada estranho chega à tela)
const num = (x, max = 1e12) => (typeof x === 'number' && isFinite(x) && x >= 0 ? Math.min(x, max) : 0);
const ehData = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);
const ehId = x => typeof x === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(x);
function mapa(o, chaveOk, valor) { const r = {}; if (o && typeof o === 'object' && !Array.isArray(o)) for (const k of Object.keys(o).slice(0, 5000)) if (chaveOk(k)) { const v = valor(o[k]); if (v !== undefined) r[k] = v; } return r; }
function sanear(o) {
  const db = vazio();
  if (!o || typeof o !== 'object' || o.v !== 1) return db;
  db.perfis = (Array.isArray(o.perfis) ? o.perfis : []).filter(p => p && /^p[a-z0-9]{3,30}$/.test(p.id) && typeof p.nome === 'string' && p.nome.trim())
    .slice(0, 20).map(p => ({ id: p.id, nome: Array.from(p.nome.trim()).slice(0, 20).join(''), cor: Math.floor(num(p.cor, 99)), criado: ehData(p.criado) ? p.criado : '' }));
  const ids = new Set(db.perfis.map(p => p.id));
  db.ativo = ids.has(o.ativo) ? o.ativo : (db.perfis[0] ? db.perfis[0].id : null);
  db.voz = o.voz !== false; db.som = o.som !== false;
  db.migrado = mapa(o.migrado, k => k.length < 60, v => (v === true ? true : undefined));
  db.dados = mapa(o.dados, k => ids.has(k), porMat => mapa(porMat, ehId, d => {
    if (!d || typeof d !== 'object') return undefined;
    return {
      xp: num(d.xp), melhorCombo: num(d.melhorCombo, 1e6), tempo: num(d.tempo), loteVisto: num(d.loteVisto, 1e4),
      licoes: mapa(d.licoes, ehId, l => (l && typeof l === 'object' ? { estrelas: Math.min(3, Math.floor(num(l.estrelas))), rodadas: Math.floor(num(l.rodadas, 1e6)) } : undefined)),
      q: mapa(d.q, ehId, x => (x && typeof x === 'object' ? { v: num(x.v), c: num(x.c), e: num(x.e), s: num(x.s), ul: x.ul === 0 ? 0 : 1, u: num(x.u, 1e15) } : undefined)),
      dias: mapa(d.dias, ehData, v => num(v, 1e6)),
      simulados: (Array.isArray(d.simulados) ? d.simulados : []).filter(x => x && ehData(x.data)).slice(-200).map(x => ({ data: x.data, nota: Math.min(10, num(x.nota)), n: num(x.n, 1e4) })),
      cartoes: mapa(d.cartoes, ehId, v => (v === 'sei' || v === 'rever' ? v : undefined)),
    };
  }));
  return db;
}
function lerTudo() {
  try { return sanear(JSON.parse(localStorage.getItem(KEY))); } catch (e) {}
  return vazio();
}
let DB = lerTudo();
let GRAVOU_OK = true;
function gravar() {
  try {
    const txt = JSON.stringify(DB);
    if (localStorage.getItem(KEY) !== txt) localStorage.setItem(KEY, txt); // não grava o que não mudou (evita abas recarregando uma à outra)
    GRAVOU_OK = true;
  } catch (e) { GRAVOU_OK = false; }
}
// outra aba (ou a página restaurada pelo "voltar" do Safari) pode ter uma cópia velha: recarrega para não gravar por cima
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
addEventListener('storage', e => { if (e.key === KEY) location.reload(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} // pede ao navegador para não apagar o progresso
// letras de verdade (um emoji conta como uma letra só)
const letras = s => Array.from(String(s));

const CORES_PERFIL = ['#2D5BD0', '#C4407A', '#14755B', '#7A4FD0', '#D2691E', '#0F8BA8'];
function novoPerfil(nome) {
  const p = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nome: letras(nome.trim()).slice(0, 20).join(''), cor: DB.perfis.length % CORES_PERFIL.length, criado: hoje() };
  DB.perfis.push(p); DB.ativo = p.id; gravar(); return p;
}
// backup: o progresso inteiro vira um código de texto (para guardar no WhatsApp, e-mail etc.)
const codigoBackup = () => btoa(unescape(encodeURIComponent(JSON.stringify(DB))));
function restaurarBackup(txt) {
  const o = JSON.parse(decodeURIComponent(escape(atob(String(txt).replace(/\s+/g, '')))));
  if (!o || o.v !== 1 || !Array.isArray(o.perfis)) throw new Error('código inválido');
  const limpo = sanear(o);
  if (!limpo.perfis.length) throw new Error('código sem criança');
  DB = limpo; gravar();
}
function perfilAtivo() { return DB.perfis.find(p => p.id === DB.ativo) || null; }
function apagarPerfil(id) { DB.perfis = DB.perfis.filter(p => p.id !== id); delete DB.dados[id]; if (DB.ativo === id) DB.ativo = DB.perfis[0] ? DB.perfis[0].id : null; gravar(); }
function dadosDe(pid, slug) {
  DB.dados[pid] = DB.dados[pid] || {};
  const d = DB.dados[pid][slug] = DB.dados[pid][slug] || {};
  // mesma ordem de campos do sanear(): assim duas abas gravam exatamente o mesmo texto e não recarregam uma à outra
  return Object.assign(d, { xp: d.xp || 0, melhorCombo: d.melhorCombo || 0, tempo: d.tempo || 0, loteVisto: d.loteVisto || 0, licoes: d.licoes || {}, q: d.q || {}, dias: d.dias || {}, simulados: d.simulados || [], cartoes: d.cartoes || {} });
}
// dias com estudo (qualquer matéria) -> ofensiva e meta do dia
function diasDoPerfil(pid) {
  const tot = {}; const m = DB.dados[pid] || {};
  Object.values(m).forEach(d => Object.entries(d.dias || {}).forEach(([k, v]) => { tot[k] = (tot[k] || 0) + v; }));
  return tot;
}
function ofensiva(pid) {
  const dias = diasDoPerfil(pid); let n = 0; const d = new Date();
  if (!dias[hoje(d)]) d.setDate(d.getDate() - 1); // ainda não estudou hoje: conta até ontem
  while (dias[hoje(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function pontosHoje(pid) { return diasDoPerfil(pid)[hoje()] || 0; }

// importa o progresso do quiz antigo (mesmo endereço do GitHub Pages), uma vez só
function migrarLegado() {
  for (const k in LEGADO) {
    if (DB.migrado[k]) continue;
    try {
      let old = null; try { old = JSON.parse(localStorage.getItem(k)); } catch (e) {}
      if (!old || typeof old !== 'object' || !old.started) continue;
      const nome = typeof old.name === 'string' && old.name.trim() && old.name !== 'você' ? old.name : 'Estudante';
      const ativoAntes = DB.ativo;
      const p = DB.perfis.find(x => x.nome.toLowerCase() === nome.toLowerCase()) || novoPerfil(nome);
      if (ativoAntes) DB.ativo = ativoAntes; // não troca a criança que já estava escolhida
      const d = dadosDe(p.id, LEGADO[k]);
      d.xp += Number(old.xp) || 0; d.melhorCombo = Math.max(d.melhorCombo, Number(old.bestCombo) || 0);
      Object.entries(old.done || {}).forEach(([lid, v]) => { const id = lid === 'final' ? 'simulado' : lid; const at = d.licoes[id] || {}; d.licoes[id] = { estrelas: Math.max((v && v.stars) || 0, at.estrelas || 0), rodadas: (at.rodadas || 0) + 1 }; });
      if (typeof old.voice === 'boolean') DB.voz = old.voice;
      if (typeof old.sound === 'boolean') DB.som = old.sound;
      if (!DB.ativo) DB.ativo = p.id;
    } catch (e) {}
    DB.migrado[k] = true; // mesmo se der erro: nunca tenta de novo (evita tela em branco)
  }
  gravar();
}

/* ---------- prova: contagem regressiva ---------- */
function diasAte(iso) { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); const a = new Date(y, m - 1, d), b = new Date(); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 864e5); }
function textoProva(iso) { const n = diasAte(iso); if (n === null || n < 0) return ''; return n === 0 ? 'Prova hoje!' : n === 1 ? 'Prova amanhã' : 'Prova em ' + n + ' dias'; }

/* ---------- mascote Tico (um tico-tico) ---------- */

    ? '<path d="M41 57q6-8 12 0M67 57q6-8 12 0" stroke="#1D2340" stroke-width="4" fill="none" stroke-linecap="round"/>'

       <circle cx="${mood === 'think' ? 49 : 48}" cy="${mood === 'think' ? 53 : 57}" r="3.8" fill="#1D2340"/>
       <circle cx="${mood === 'think' ? 75 : 74}" cy="${mood === 'think' ? 53 : 57}" r="3.8" fill="#1D2340"/>`;
  const wings = mood === 'cheer'
    ? '<ellipse cx="22" cy="52" rx="9" ry="20" transform="rotate(-35 22 52)" fill="#7E4B22"/><ellipse cx="98" cy="52" rx="9" ry="20" transform="rotate(35 98 52)" fill="#7E4B22"/>'
    : '<ellipse cx="25" cy="78" rx="9" ry="19" transform="rotate(15 25 78)" fill="#7E4B22"/><ellipse cx="95" cy="78" rx="9" ry="19" transform="rotate(-15 95 78)" fill="#7E4B22"/>';

}

function avatar(p, size = 44) {
  const c = CORES_PERFIL[p.cor % CORES_PERFIL.length];
  return `<span class="ava" style="width:${size}px;height:${size}px;background:${c};font-size:${Math.round(size * .46)}px">${esc((letras(p.nome)[0] || '?').toUpperCase())}</span>`;
}

/* ---------- som (sintetizado, sem arquivos) ---------- */
let AC = null;

  ok() { tone(784, 0, .16); tone(1175, .1, .28); },
  combo() { tone(784, 0, .12); tone(988, .08, .12); tone(1319, .16, .3); },

/* ---------- voz (do próprio navegador) ---------- */
let VOICE = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^pt[-_]BR/i.test(v.lang));
  const fav = ['Luciana', 'Francisca', 'Google português do Brasil', 'Thalita', 'Maria'];
  VOICE = vs.find(v => fav.some(f => v.name.includes(f))) || vs[0] || speechSynthesis.getVoices().find(v => /^pt/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function falaRobo(text) {
  try { if (AUDIO_EL && !AUDIO_EL.paused) AUDIO_EL.pause(); } catch (e) {} // nunca duas vozes ao mesmo tempo
  if (!('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR'; if (VOICE) u.voice = VOICE; u.rate = 0.97; u.pitch = 1.08; speechSynthesis.speak(u); } catch (e) {}
}
/* Narração gravada (voz profissional): window.AUDIOS = { hashId(texto): 'arquivo.mp3' }, colocado pelo montar.mjs.
   Se a fala tem áudio gravado, toca o arquivo; senão (ou se o aparelho bloquear), usa a voz do navegador.
   Um único elemento de áudio, destravado no primeiro toque (exigência do Safari no iPhone). */

}

  if (!AUDIO_EL || !window.AUDIOS || AUDIO_EL.dataset.ok) return;

  try {
    const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));

}

const temNarracao = () => !!(window.AUDIOS && Object.keys(window.AUDIOS).length && AUDIO_EL);
let FALA_VEZ = 0; // cada fala nova invalida a sequência anterior
/* Fala uma lista de pedaços em sequência. Se TODOS têm áudio gravado, toca um depois do outro;
   se falta algum, fala tudo com a voz do navegador (nunca mistura as duas vozes na mesma fala). */
function sayPartes(partes, force) {
  partes = partes.map(p => String(p || '').trim()).filter(Boolean);

/* ---------- confete ---------- */

/* ---------- tela "quem vai estudar?" (usada no portal e nas matérias) ---------- */
function telaPerfis($app, aoEscolher, texto) {
  hush();
  const lista = DB.perfis;
  $app.innerHTML = `<div class="start">
    ${tico('happy', 130, 'bounce')}
    <div class="bubble">${lista.length ? (texto || 'Oi! Eu sou o <b>Tico</b>. Quem vai estudar comigo hoje?') : 'Oi! Eu sou o <b>Tico</b>, um tico-tico. Vou te ajudar a estudar. Qual é o seu nome?'}</div>
    ${lista.length ? `<div class="perfis">${lista.map(p => `<button class="perfil" data-p="${p.id}">${avatar(p, 64)}<b>${esc(p.nome)}</b></button>`).join('')}
      <button class="perfil novo" id="add"><span class="ava ghost" style="width:64px;height:64px">${ICON.plus}</span><b>Adicionar</b></button></div>` : ''}
    <div id="novoBox" ${lista.length ? 'hidden' : ''} style="width:100%;display:grid;gap:12px;justify-items:center">
      <input class="name-in" id="nm" maxlength="20" placeholder="Digite seu nome" aria-label="Seu nome" autocomplete="off">
      <button class="btn" id="go" style="max-width:340px">Começar</button>
    </div>
  </div>`;
  const entrar = p => { DB.ativo = p.id; gravar(); audio(); SFX.tap(); aoEscolher(p); };
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => entrar(DB.perfis.find(p => p.id === b.dataset.p)));
  const add = document.getElementById('add');
  if (add) add.onclick = () => { SFX.tap(); document.getElementById('novoBox').hidden = false; add.hidden = true; document.getElementById('nm').focus(); };
  const go = () => { const n = (document.getElementById('nm').value || '').trim(); if (!n) { document.getElementById('nm').focus(); return; } entrar(novoPerfil(n)); };
  document.getElementById('go').onclick = go;
  document.getElementById('nm').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
}

</script>

<script>
/* ===================== PORTAL (página inicial com todas as matérias) =====================
   Depende de: base.js + MATERIAS (lista gerada na montagem: slug, titulo, serie, prova, cor, total, ids). */
const $app = document.getElementById('app');
const CORES_P = { azul: 'var(--blue)', verde: 'var(--green)', ambar: 'var(--amber)', roxo: 'var(--purple)', rosa: 'var(--pink)', ciano: 'var(--cyan)' };

function progresso(pid, m) {
  const d = ((DB.dados[pid] || {})[m.slug]) || { q: {} };
  const dom = m.ids.filter(id => { const s = d.q[id]; return s && (s.s >= 2 || (s.s >= 1 && s.e === 0)); }).length;
  return { dom, pct: Math.round(dom / m.total * 100), xp: d.xp || 0 };
}

function renderPortal(p) {
  hush(); window.scrollTo(0, 0);
  const ofs = ofensiva(p.id), hp = pontosHoje(p.id);
  const lista = MATERIAS.slice().sort((a, b) => { const da = diasAte(a.prova), db = diasAte(b.prova); return (da === null || da < 0 ? 1e9 : da) - (db === null || db < 0 ? 1e9 : db); });
  $app.innerHTML = `<div class="top"><button class="chip-perfil" id="troca" aria-label="Trocar de criança">${avatar(p, 40)}<span class="hello">Oi, ${esc(p.nome)}!</span></button>
    <div class="pills"><span class="pill" title="Dias seguidos estudando">${ICON.fire}${ofs}</span></div></div>
  <div class="hero card"><div class="hero-t">${tico('happy', 72)}<div style="flex:1"><div class="hero-m">Minhas matérias</div>
    <div class="meta"><div class="meta-l"><b>Meta do dia</b><span>${Math.min(hp, META_DIA)}/${META_DIA}</span></div><div class="prog small"><i style="width:${Math.min(100, hp / META_DIA * 100)}%;background:${hp >= META_DIA ? 'var(--gold)' : 'var(--ok)'}"></i></div></div></div></div></div>
  <div class="materias">${lista.map(m => { const pr = progresso(p.id, m), pv = textoProva(m.prova); return `<a class="materia" href="./${m.slug}/" style="--mc:${CORES_P[m.cor] || CORES_P.azul}">
      <div class="mt-top"><h2>${esc(m.titulo)}</h2><span>${esc(m.serie || '')}</span></div>
      ${pv ? `<div class="prova">${ICON.cal}${pv}</div>` : ''}
      <div class="mt-mods">${m.modulos.map(x => `<span>${esc(x)}</span>`).join('')}</div>
      <div class="prog small"><i style="width:${Math.max(3, pr.pct)}%;background:var(--mc)"></i></div>
      <small>${pr.dom} de ${m.total} perguntas dominadas · ${pr.xp} pontos</small></a>`; }).join('')}</div>
  <section class="settings"><div class="row wrap"><button class="linkbtn" id="troca2">Trocar de criança</button></div></section>`;
  document.getElementById('troca').onclick = document.getElementById('troca2').onclick = () => { SFX.tap(); telaPerfis($app, renderPortal, 'Quem vai estudar agora?'); };
  say(`Oi, ${p.nome}! Escolha a matéria.`);
}

migrarLegado();
(() => { const p = perfilAtivo(); p ? renderPortal(p) : telaPerfis($app, renderPortal); })();

</script>
